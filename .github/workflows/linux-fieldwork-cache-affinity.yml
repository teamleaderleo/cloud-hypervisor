name: Linux Fieldwork AArch64 cache affinity baseline

on:
  push:
    branches:
      - linux-fieldwork/cache-affinity-selection
  pull_request:
    branches:
      - linux-fieldwork/cache-affinity-upstream-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install AArch64 probe toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          rustup target add aarch64-unknown-linux-gnu
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Apply exact prerequisites and inject probe
        run: python3 linux-fieldwork/cache-affinity/run_probe.py
      - name: Verify test-only scope
        run: |
          git diff --check
          git diff --name-only HEAD | tee /tmp/changed-files.txt
          test "$(wc -l < /tmp/changed-files.txt)" -eq 1
          grep -Fx 'arch/src/aarch64/cache.rs' /tmp/changed-files.txt
      - name: Verify CPU0 and affinity policy mismatch
        run: python3 linux-fieldwork/cache-affinity/verify_policy.py | tee /tmp/cache-affinity-policy.log
      - name: Verify nightly formatting
        run: cargo +nightly fmt --all -- --check
      - name: Execute heterogeneous cache-root fixture
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: |
          set -o pipefail
          cargo test -p arch --features kvm --target aarch64-unknown-linux-gnu \
            aarch64::cache::tests::test_valid_cpu_roots_can_have_different_private_cache_geometry \
            -- --nocapture 2>&1 | tee /tmp/cache-affinity-tests.log
          grep -F 'test aarch64::cache::tests::test_valid_cpu_roots_can_have_different_private_cache_geometry ... ok' /tmp/cache-affinity-tests.log
      - name: Retain baseline probe
        run: |
          git diff --binary HEAD -- arch/src/aarch64/cache.rs > /tmp/cache-affinity-probe.patch
          sha256sum /tmp/cache-affinity-probe.patch | tee /tmp/probe-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-fieldwork-cache-affinity-baseline
          path: |
            /tmp/changed-files.txt
            /tmp/cache-affinity-policy.log
            /tmp/cache-affinity-tests.log
            /tmp/cache-affinity-probe.patch
            /tmp/probe-sha256.txt
          if-no-files-found: warn

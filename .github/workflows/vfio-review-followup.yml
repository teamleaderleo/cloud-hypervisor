name: VFIO review follow-up

on:
  push:
    branches:
      - research/ch-vfio-review-phip1611

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust tools
        run: |
          rustup component add clippy
          rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Apply review follow-up
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pci/src/vfio.rs")
          text = path.read_text()

          old_imports = '''mod mmio_region_range_tests {
              use std::env::temp_dir;
              use std::fs::{OpenOptions, remove_file};
              use std::os::fd::AsFd;
              use std::process::id;
              use std::sync::atomic::{AtomicU64, Ordering};

              use super::*;

              static NEXT_FIXTURE: AtomicU64 = AtomicU64::new(0);
          '''
          new_imports = '''mod mmio_region_range_tests {
              use std::env::temp_dir;
              use std::os::fd::AsFd;

              use super::*;
              use vmm_sys_util::tempfile::TempFile;
          '''
          if old_imports not in text:
              raise SystemExit("expected test import block not found")
          text = text.replace(old_imports, new_imports, 1)

          old_setup = '''        let page_size = get_page_size();
                  let serial = NEXT_FIXTURE.fetch_add(1, Ordering::Relaxed);
                  let path = temp_dir().join(format!("cloud-hypervisor-vfio-sparse-{}-{serial}", id()));
                  let file = OpenOptions::new()
                      .read(true)
                      .write(true)
                      .create(true)
                      .truncate(true)
                      .open(&path)
                      .unwrap();
                  file.set_len(2 * page_size).unwrap();
          '''
          new_setup = '''        let page_size = get_page_size();
                  let file = TempFile::new_with_prefix(
                      temp_dir().join("cloud-hypervisor-vfio-sparse-"),
                  )
                  .unwrap();
                  file.as_file().set_len(2 * page_size).unwrap();
          '''
          if old_setup not in text:
              raise SystemExit("expected fixture setup not found")
          text = text.replace(old_setup, new_setup, 1)

          marker = "mod mmio_region_range_tests {"
          start = text.index(marker)
          end = text.index("\n#[cfg(test)]\nmod tests {", start)
          module = text[start:end]
          if module.count("file.as_fd()") != 2:
              raise SystemExit("expected exactly two file.as_fd() calls")
          module = module.replace("file.as_fd()", "file.as_file().as_fd()")
          if "        remove_file(path).unwrap();\n" not in module:
              raise SystemExit("expected manual file removal not found")
          module = module.replace("        remove_file(path).unwrap();\n", "", 1)

          needle = '''        let guest_addr = page_size + page_size / 2;

                  let pointer = regions
          '''
          replacement = '''        let guest_addr = page_size + page_size / 2;

                  // The BAR spans 4 pages, but only [P, 2P) and [3P, 4P) are mmap-backed.
                  // [1.5P, 2.5P) fits the BAR but extends beyond the first sparse mapping.
                  let pointer = regions
          '''
          if needle not in module:
              raise SystemExit("expected test assertion location not found")
          module = module.replace(needle, replacement, 1)
          text = text[:start] + module + text[end:]
          path.write_text(text)
          PY

          cargo +nightly fmt --all
          git diff --check
          git diff -- pci/src/vfio.rs

      - name: Validation
        run: |
          cargo test --locked -p pci --features kvm --lib vfio::mmio_region_range_tests::sparse_range_must_fit_single_user_mapping
          cargo test --locked -p pci --features kvm --lib
          cargo check --locked -p virtio-devices --features kvm
          cargo clippy --locked -p pci --features kvm --all-targets -- -D warnings
          cargo +nightly fmt --all -- --check
          git diff --check

      - name: Commit validated follow-up
        run: |
          rm .github/workflows/vfio-review-followup.yml
          git config user.name "linux-fieldwork-bot"
          git config user.email "linux-fieldwork-bot@users.noreply.github.com"
          git add pci/src/vfio.rs .github/workflows/vfio-review-followup.yml
          git commit -m "pci: Address VFIO sparse mapping review"
          git push origin HEAD:research/ch-vfio-review-phip1611

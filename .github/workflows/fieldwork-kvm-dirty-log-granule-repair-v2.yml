name: Fieldwork dirty-log granularity repair v2

on:
  push:
    branches:
      - fieldwork/kvm-dirty-log-granule-repair-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v7
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: 1af93ac7035cda77cd87b0c18b1134ebb0928052
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch disposable transformer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add fieldwork-read "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 fieldwork-read fieldwork/kvm-dirty-log-granule-repair-v2
          git show FETCH_HEAD:.github/fieldwork/apply-dirty-log-repair-v2.py > /tmp/apply-dirty-log-repair-v2.py
          git show FETCH_HEAD:.github/fieldwork/fix-dirty-log-oracle-v2.py > /tmp/fix-dirty-log-oracle-v2.py
          git show FETCH_HEAD:.github/fieldwork/fix-dirty-log-clippy-v2.py > /tmp/fix-dirty-log-clippy-v2.py

      - name: Apply repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/apply-dirty-log-repair-v2.py
          python3 /tmp/fix-dirty-log-oracle-v2.py
          python3 /tmp/fix-dirty-log-clippy-v2.py

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Format candidate
        run: cargo +nightly fmt --all

      - name: Verify exact product scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          expected=$(printf '%s\n' \
            hypervisor/src/kvm/mod.rs \
            hypervisor/src/lib.rs \
            hypervisor/src/mshv/mod.rs \
            hypervisor/src/vm.rs \
            vmm/src/memory_manager.rs)
          actual=$(git diff --name-only)
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Run repaired dirty-log tests
        run: cargo test -p vmm --features kvm dirty_log_ -- --nocapture

      - name: Run existing dirty-range control
        run: cargo test -p vm-migration test_memory_range_table_from_dirty_ranges_iter -- --nocapture

      - name: Check KVM and MSHV backends
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p vmm --features kvm
          cargo check -p vmm --features mshv

      - name: Cross-check AArch64 KVM and MSHV builds
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p vmm --features kvm --target aarch64-unknown-linux-gnu
          cargo check -p vmm --features mshv --target aarch64-unknown-linux-gnu

      - name: Clippy repaired KVM and MSHV paths
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p vmm --features kvm --all-targets --tests -- -D warnings
          cargo clippy -p vmm --features mshv --all-targets --tests -- -D warnings

      - name: Inspect final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --stat
          git diff --check
          git diff

      - name: Publish clean technical candidate branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hypervisor/src/kvm/mod.rs \
            hypervisor/src/lib.rs \
            hypervisor/src/mshv/mod.rs \
            hypervisor/src/vm.rs \
            vmm/src/memory_manager.rs
          git commit \
            -m 'vmm: Preserve dirty log granularity' \
            -m 'Carry the bitmap byte granularity with each backend dirty log so KVM host-page bits are decoded at the correct guest addresses.' \
            -m 'Validate the VMM bitmap unit, coverage, alignment, and bounds before combining it with backend bits. Keep MSHV at its existing 4K unit and fail closed if its unit ever differs from the VMM bitmap unit.' \
            -m 'Assisted-by: ChatGPT:GPT-5.6 Sol'
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 5
          git remote add fieldwork-write "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push fieldwork-write HEAD:refs/heads/linux-fieldwork/kvm-dirty-log-granule-repair-v2

name: Bus stack strong-lifetime revalidation

on:
  push:
    branches:
      - research/ch-bus-r677-r678-r679-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bus-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact-current research branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact upstream base
        shell: bash
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 69d4c0a82ef15b2660906013bd87ae32668e7998 HEAD
          test -z "$(git diff 69d4c0a82ef15b2660906013bd87ae32668e7998 -- vm-device/src/bus.rs)"

      - name: Install Rust toolchains
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Materialize corrected clean Bus candidate
        shell: bash
        run: |
          set -euxo pipefail
          git show origin/review/ch-bus-r677-r678-r679-clean:vm-device/src/bus.rs > vm-device/src/bus.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vm-device/src/bus.rs')
          text = path.read_text()
          old = '''        let device = devices
            .get(&old_range)
            .cloned()
            .ok_or(Error::MissingAddressRange)?;
        if device.upgrade().is_none() {
            return Err(Error::MissingAddressRange);
        }
'''
          new = '''        let device = devices
            .get(&old_range)
            .and_then(Weak::upgrade)
            .ok_or(Error::MissingAddressRange)?;
'''
          if old not in text:
              raise SystemExit('old clean weak-lifetime shape changed')
          text = text.replace(old, new, 1)
          old_insert = '        debug_assert!(devices.insert(new_range, device).is_none());\n'
          new_insert = '        debug_assert!(devices.insert(new_range, Arc::downgrade(&device)).is_none());\n'
          if old_insert not in text:
              raise SystemExit('old clean update insertion shape changed')
          path.write_text(text.replace(old_insert, new_insert, 1))
          PY
          cargo +nightly fmt --all
          git add vm-device/src/bus.rs
          git diff --cached --check
          cp vm-device/src/bus.rs /tmp/bus-v2-product.rs
          git diff --cached -- vm-device/src/bus.rs > /tmp/bus-v2-product.diff
          sha256sum /tmp/bus-v2-product.diff | tee /tmp/bus-v2-product.sha256

      - name: Inject deterministic in-flight lifetime discriminator
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vm-device/src/bus.rs')
          text = path.read_text()

          old_struct = '''#[derive(Default)]
pub struct Bus {
    devices: RwLock<BTreeMap<BusRange, Weak<dyn BusDeviceSync>>>,
}
'''
          new_struct = '''#[derive(Default)]
pub struct Bus {
    devices: RwLock<BTreeMap<BusRange, Weak<dyn BusDeviceSync>>>,
    #[cfg(test)]
    update_barrier: Mutex<Option<Arc<Barrier>>>,
}
'''
          if old_struct not in text:
              raise SystemExit('Bus struct shape changed')
          text = text.replace(old_struct, new_struct, 1)

          old_new = '''    pub fn new() -> Bus {
        Bus {
            devices: RwLock::new(BTreeMap::new()),
        }
    }
'''
          new_new = '''    pub fn new() -> Bus {
        Bus {
            devices: RwLock::new(BTreeMap::new()),
            #[cfg(test)]
            update_barrier: Mutex::new(None),
        }
    }

    #[cfg(test)]
    fn set_update_barrier(&self, barrier: Option<Arc<Barrier>>) {
        *self.update_barrier.lock().unwrap() = barrier;
    }
'''
          if old_new not in text:
              raise SystemExit('Bus::new shape changed')
          text = text.replace(old_new, new_new, 1)

          seam = '''        let device = devices
            .get(&old_range)
            .and_then(Weak::upgrade)
            .ok_or(Error::MissingAddressRange)?;

        if devices
'''
          seam_instrumented = '''        let device = devices
            .get(&old_range)
            .and_then(Weak::upgrade)
            .ok_or(Error::MissingAddressRange)?;

        #[cfg(test)]
        let update_barrier = self.update_barrier.lock().unwrap().clone();
        #[cfg(test)]
        if let Some(barrier) = update_barrier {
            barrier.wait();
            barrier.wait();
        }

        if devices
'''
          if seam not in text:
              raise SystemExit('update_range strong-lifetime seam changed')
          text = text.replace(seam, seam_instrumented, 1)

          end = text.rfind('\n}')
          if end < text.index('#[cfg(test)]\nmod unit_tests'):
              raise SystemExit('unit test module terminator missing')
          test_lines = [
              '',
              '    #[test]',
              '    fn update_range_keeps_device_alive_until_move_finishes() {',
              '        let bus = Arc::new(Bus::new());',
              '        let device = Arc::new(DummyDevice);',
              '        let weak = Arc::downgrade(&device);',
              '        bus.insert(device.clone(), 0x1000, 0x100).unwrap();',
              '',
              '        let barrier = Arc::new(Barrier::new(2));',
              '        bus.set_update_barrier(Some(barrier.clone()));',
              '',
              '        let update_bus = bus.clone();',
              '        let thread = std::thread::spawn(move || {',
              '            update_bus.update_range(0x1000, 0x100, 0x2000, 0x100)',
              '        });',
              '',
              '        barrier.wait();',
              '        drop(device);',
              '        assert!(',
              '            weak.upgrade().is_some(),',
              '            "update_range must retain the device strongly while the move is in flight"',
              '        );',
              '        barrier.wait();',
              '        thread.join().unwrap().unwrap();',
              '        bus.set_update_barrier(None);',
              '',
              '        assert!(weak.upgrade().is_none());',
              '    }',
          ]
          text = text[:end] + '\n'.join(test_lines) + text[end:]
          path.write_text(text)
          PY
          cargo +nightly fmt --all

      - name: Run lifetime discriminator and Bus controls
        shell: bash
        run: |
          set -euxo pipefail
          cargo +1.89.0 test --locked -p vm-device --lib \
            update_range_keeps_device_alive_until_move_finishes -- --nocapture \
            2>&1 | tee /tmp/bus-v2.log
          cargo +1.89.0 test --locked -p vm-device \
            2>&1 | tee -a /tmp/bus-v2.log

      - name: Quality gates with workflow-only discriminator
        shell: bash
        run: |
          set -euxo pipefail
          cargo +stable clippy --locked -p vm-device --all-targets -- -D warnings \
            2>&1 | tee -a /tmp/bus-v2.log
          cargo +nightly fmt --all -- --check 2>&1 | tee -a /tmp/bus-v2.log

      - name: Restore exact product candidate and verify identity
        shell: bash
        run: |
          set -euxo pipefail
          cp /tmp/bus-v2-product.rs vm-device/src/bus.rs
          git add vm-device/src/bus.rs
          git diff --cached --check
          git diff --cached -- vm-device/src/bus.rs > /tmp/bus-v2-product-final.diff
          sha256sum /tmp/bus-v2-product-final.diff | tee /tmp/bus-v2-product-final.sha256
          cmp /tmp/bus-v2-product.diff /tmp/bus-v2-product-final.diff

      - name: Commit tested product candidate
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name Leo
          git config user.email cheerleaderleo@outlook.com
          git commit -s \
            -m 'vm-device: make Bus range updates atomic' \
            -m 'Keep overlap validation and mutation under one write guard, preserve the device lifetime across range moves, and evaluate range endpoints without u64 overflow.' \
            -m 'Assisted-by: ChatGPT:GPT-5.6 Sol'
          git push origin HEAD:research/ch-bus-r677-r678-r679-v2
          git rev-parse HEAD | tee /tmp/bus-v2-head.txt
          git rev-parse HEAD:vm-device/src/bus.rs | tee /tmp/bus-v2-blob.txt

      - name: Record receipt
        if: always()
        shell: bash
        run: |
          set -u
          {
            echo 'upstream_base=69d4c0a82ef15b2660906013bd87ae32668e7998'
            echo 'supersedes_bus_clean=2edcf22f0bd35beff06ab2b4e132cf240e54d2f9'
            echo "runner_head=$(git rev-parse HEAD)"
            if [ -f /tmp/bus-v2-product.sha256 ]; then cat /tmp/bus-v2-product.sha256; fi
            if [ -f /tmp/bus-v2-head.txt ]; then cat /tmp/bus-v2-head.txt; fi
            if [ -f /tmp/bus-v2-blob.txt ]; then cat /tmp/bus-v2-blob.txt; fi
            git status --short
          } > /tmp/bus-v2-receipt.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch-bus-r677-r678-r679-v2
          path: |
            /tmp/bus-v2-product.diff
            /tmp/bus-v2-product.sha256
            /tmp/bus-v2-product-final.diff
            /tmp/bus-v2-product-final.sha256
            /tmp/bus-v2.log
            /tmp/bus-v2-head.txt
            /tmp/bus-v2-blob.txt
            /tmp/bus-v2-receipt.txt
          if-no-files-found: warn

name: Fieldwork QCOW inline old L2 release v2

on:
  push:
    branches:
      - linux-fieldwork/qcow-l2-inline-release-v2-r609

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused review follow-up
        shell: bash
        run: |
          printf '%s' ' ' | tr -d ' ' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py

      - name: Format
        run: cargo fmt --all

      - name: Diff check
        run: git diff --check

      - name: Test block crate
        run: cargo test --locked -p block

      - name: Test block crate with io_uring
        run: cargo test --locked -p block --features io_uring

      - name: Clippy
        run: cargo clippy --locked -p block --lib --features io_uring -- -D warnings

      - name: Commit source-only follow-up
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add block/src/formats/qcow/metadata.rs
          git commit -m 'fieldwork: inline old L2 release safely'
          git push origin HEAD:linux-fieldwork/qcow-l2-inline-release-v2-r609

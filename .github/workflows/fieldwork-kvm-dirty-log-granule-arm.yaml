name: Fieldwork KVM dirty-log granule arm64 validation

on:
  push:
    branches:
      - linux-fieldwork/validate-kvm-dirty-log-granule

permissions:
  contents: write

jobs:
  validate-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@v7
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: 1af93ac7035cda77cd87b0c18b1134ebb0928052
          fetch-depth: 0
          persist-credentials: false

      - name: Apply minimal candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, label: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              print(f"{label}: matches={count}")
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          def lines(*items: str) -> str:
              return "\n".join(items)

          replace_once(
              "hypervisor/src/vm.rs",
              "NonZeroU64 import",
              "use std::any::Any;",
              lines("use std::any::Any;", "use std::num::NonZeroU64;"),
          )
          replace_once(
              "hypervisor/src/vm.rs",
              "Vm trait",
              lines(
                  "    /// Get dirty pages bitmap",
                  "    fn get_dirty_log(&self, slot: u32, base_gpa: u64, memory_size: u64) -> Result<Vec<u64>>;",
              ),
              lines(
                  "    /// Return the page size represented by each dirty-log bitmap bit.",
                  "    fn dirty_log_page_size(&self) -> Result<NonZeroU64>;",
                  "    /// Get dirty pages bitmap",
                  "    fn get_dirty_log(&self, slot: u32, base_gpa: u64, memory_size: u64) -> Result<Vec<u64>>;",
              ),
          )
          replace_once(
              "hypervisor/src/kvm/mod.rs",
              "KVM backend",
              lines(
                  "    ///",
                  "    /// Get dirty pages bitmap (one bit per page)",
                  "    ///",
                  "    fn get_dirty_log(&self, slot: u32, _base_gpa: u64, memory_size: u64) -> vm::Result<Vec<u64>> {",
              ),
              lines(
                  "    /// Return the page size represented by each KVM dirty-log bitmap bit.",
                  "    fn dirty_log_page_size(&self) -> vm::Result<std::num::NonZeroU64> {",
                  "        // SAFETY: FFI call. Trivially safe.",
                  "        let page_size = unsafe { libc::sysconf(libc::_SC_PAGESIZE) };",
                  "        let page_size = u64::try_from(page_size)",
                  "            .map_err(|e| vm::HypervisorVmError::GetDirtyLog(e.into()))?;",
                  "        std::num::NonZeroU64::new(page_size).ok_or_else(|| {",
                  "            vm::HypervisorVmError::GetDirtyLog(anyhow!(\"Host page size is zero\"))",
                  "        })",
                  "    }",
                  "",
                  "    ///",
                  "    /// Get dirty pages bitmap (one bit per page)",
                  "    ///",
                  "    fn get_dirty_log(&self, slot: u32, _base_gpa: u64, memory_size: u64) -> vm::Result<Vec<u64>> {",
              ),
          )
          replace_once(
              "hypervisor/src/mshv/mod.rs",
              "MSHV backend",
              lines(
                  "    ///",
                  "    /// Get dirty pages bitmap (one bit per page)",
                  "    ///",
                  "    fn get_dirty_log(&self, _slot: u32, base_gpa: u64, memory_size: u64) -> vm::Result<Vec<u64>> {",
              ),
              lines(
                  "    /// Return the page size represented by each MSHV dirty-log bitmap bit.",
                  "    fn dirty_log_page_size(&self) -> vm::Result<std::num::NonZeroU64> {",
                  "        Ok(std::num::NonZeroU64::new(1u64 << PAGE_SHIFT).unwrap())",
                  "    }",
                  "",
                  "    ///",
                  "    /// Get dirty pages bitmap (one bit per page)",
                  "    ///",
                  "    fn get_dirty_log(&self, _slot: u32, base_gpa: u64, memory_size: u64) -> vm::Result<Vec<u64>> {",
              ),
          )
          replace_once(
              "vmm/src/memory_manager.rs",
              "MemoryManager helper anchor",
              "impl Migratable for MemoryManager {",
              lines(
                  "fn dirty_bitmap_to_range_table(",
                  "    vm_dirty_bitmap: &[u64],",
                  "    vmm_dirty_bitmap: &[u64],",
                  "    start_addr: u64,",
                  "    page_size: u64,",
                  ") -> MemoryRangeTable {",
                  "    let dirty_bitmap = vm_dirty_bitmap",
                  "        .iter()",
                  "        .zip(vmm_dirty_bitmap.iter())",
                  "        .map(|(x, y)| x | y);",
                  "",
                  "    MemoryRangeTable::from_dirty_bitmap(dirty_bitmap, start_addr, page_size)",
                  "}",
                  "",
                  "impl Migratable for MemoryManager {",
              ),
          )
          replace_once(
              "vmm/src/memory_manager.rs",
              "MemoryManager page size",
              lines(
                  "    fn dirty_log(&mut self) -> result::Result<MemoryRangeTable, MigratableError> {",
                  "        let mut table = MemoryRangeTable::default();",
                  "        for r in &self.guest_ram_mappings {",
              ),
              lines(
                  "    fn dirty_log(&mut self) -> result::Result<MemoryRangeTable, MigratableError> {",
                  "        let mut table = MemoryRangeTable::default();",
                  "        let dirty_log_page_size = self",
                  "            .vm",
                  "            .dirty_log_page_size()",
                  "            .context(\"Error getting VM dirty log page size\")",
                  "            .map_err(MigratableError::MigrateSend)?",
                  "            .get();",
                  "        for r in &self.guest_ram_mappings {",
              ),
          )
          replace_once(
              "vmm/src/memory_manager.rs",
              "MemoryManager bitmap conversion",
              lines(
                  "            let dirty_bitmap = vm_dirty_bitmap",
                  "                .iter()",
                  "                .zip(vmm_dirty_bitmap.iter())",
                  "                .map(|(x, y)| x | y);",
                  "",
                  "            let sub_table = MemoryRangeTable::from_dirty_bitmap(dirty_bitmap, r.gpa, 4096);",
              ),
              lines(
                  "            let sub_table = dirty_bitmap_to_range_table(",
                  "                &vm_dirty_bitmap,",
                  "                &vmm_dirty_bitmap,",
                  "                r.gpa,",
                  "                dirty_log_page_size,",
                  "            );",
              ),
          )

          tests = lines(
              "",
              "#[cfg(test)]",
              "mod tests {",
              "    use super::dirty_bitmap_to_range_table;",
              "",
              "    const BASE_GPA: u64 = 0x4000_0000;",
              "",
              "    #[test]",
              "    fn test_dirty_bitmap_page_granules() {",
              "        for (page_size, expected_gpa) in [",
              "            (0x1000, 0x4000_1000),",
              "            (0x4000, 0x4000_4000),",
              "            (0x1_0000, 0x4001_0000),",
              "        ] {",
              "            let table = dirty_bitmap_to_range_table(&[0b10], &[0], BASE_GPA, page_size);",
              "            assert_eq!(table.regions().len(), 1);",
              "            assert_eq!(table.regions()[0].gpa, expected_gpa);",
              "            assert_eq!(table.regions()[0].length, page_size);",
              "        }",
              "    }",
              "",
              "    #[test]",
              "    fn test_dirty_bitmap_combines_sources_and_coalesces() {",
              "        let table = dirty_bitmap_to_range_table(&[0b0010], &[0b0100], BASE_GPA, 0x4000);",
              "        assert_eq!(table.regions().len(), 1);",
              "        assert_eq!(table.regions()[0].gpa, 0x4000_4000);",
              "        assert_eq!(table.regions()[0].length, 0x8000);",
              "    }",
              "",
              "    #[test]",
              "    fn test_dirty_bitmap_coalesces_across_words() {",
              "        let table = dirty_bitmap_to_range_table(",
              "            &[1u64 << 63, 0],",
              "            &[0, 1],",
              "            BASE_GPA,",
              "            0x1_0000,",
              "        );",
              "        assert_eq!(table.regions().len(), 1);",
              "        assert_eq!(table.regions()[0].gpa, 0x403f_0000);",
              "        assert_eq!(table.regions()[0].length, 0x2_0000);",
              "    }",
              "}",
              "",
          )
          p = Path("vmm/src/memory_manager.rs")
          p.write_text(p.read_text() + tests)
          PY

      - name: Install formatting and cross toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-x86-64-linux-gnu
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup target add x86_64-unknown-linux-gnu

      - name: Format and fence candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly fmt --all
          git diff --check
          expected=$(printf '%s\n' \
            hypervisor/src/kvm/mod.rs \
            hypervisor/src/mshv/mod.rs \
            hypervisor/src/vm.rs \
            vmm/src/memory_manager.rs)
          actual=$(git diff --name-only)
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Show host granule
        run: getconf PAGESIZE

      - name: Run dirty bitmap synthetic tests
        run: cargo test -p vmm --features kvm dirty_bitmap_ -- --nocapture

      - name: Run existing migration bitmap control
        run: cargo test -p vm-migration test_memory_range_table_from_dirty_ranges_iter -- --nocapture

      - name: Build KVM VMM on arm64
        run: cargo check -p vmm --features kvm

      - name: Cross-check MSHV VMM on x86_64
        run: cargo check -p vmm --features mshv --target x86_64-unknown-linux-gnu

      - name: Clippy KVM VMM on arm64
        run: cargo clippy -p vmm --features kvm --all-targets --tests -- -D warnings

      - name: Clippy MSHV VMM for x86_64
        run: cargo clippy -p vmm --features mshv --target x86_64-unknown-linux-gnu --all-targets --tests -- -D warnings

      - name: Inspect full diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --stat
          git diff --check
          git diff

      - name: Commit and push source-only candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hypervisor/src/kvm/mod.rs hypervisor/src/mshv/mod.rs hypervisor/src/vm.rs vmm/src/memory_manager.rs
          git commit \
            -m 'vmm: Use backend dirty log page size' \
            -m 'KVM dirty bitmap bits follow the host base page size. Carry a validated non-zero page size from the hypervisor backend into migration range conversion so 16K and 64K KVM hosts address the correct guest pages.' \
            -m 'Keep MSHV fixed at its existing 4K dirty-log unit and cover 4K, 16K, 64K, source merging, and adjacent-bit coalescing with synthetic unit tests.' \
            -m 'Assisted-by: ChatGPT:GPT-5.6 Sol'
          test "$(git rev-list --count 1af93ac7035cda77cd87b0c18b1134ebb0928052..HEAD)" = 1
          git show --stat --oneline --decorate HEAD
          git remote add fieldwork "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push fieldwork HEAD:refs/heads/linux-fieldwork/kvm-dirty-log-granule-typed-candidate

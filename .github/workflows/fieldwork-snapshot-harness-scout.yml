name: Fieldwork snapshot harness scout

on:
  push:
    branches:
      - linux-fieldwork/snapshot-harness-scout

permissions:
  contents: read

jobs:
  map-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
      - name: Map current integration helpers
        run: |
          set -eufo pipefail
          integration=cloud-hypervisor/tests/integration.rs
          wrappers=cloud-hypervisor/tests/common/tests_wrappers.rs
          infra=test_infra/src/lib.rs
          vm_config=vmm/src/vm_config.rs

          echo '=== snapshot / restore symbols ==='
          grep -nE 'fn .*snapshot|test_.*snapshot|snapshot_restore|restore_uffd|memory_restore_mode|--landlock|landlock' "$integration" | head -n 240 || true

          echo '=== UbuntuDiskConfig / disk paths ==='
          grep -n -A45 -B8 'struct UbuntuDiskConfig\|impl UbuntuDiskConfig' "$infra" | head -n 220 || true
          grep -n -A30 -B8 'fn disk(&self\|DiskType::OperatingSystem' "$infra" | head -n 220 || true

          echo '=== QCOW / backing integration usage ==='
          grep -nE 'qemu-img|backing_files|image_type=qcow' "$integration" "$wrappers" | head -n 240 || true

          echo '=== Landlock automatic rule helpers ==='
          grep -nE 'apply_landlock|parent\(\)|LandlockConfig' "$vm_config" | head -n 260 || true

          echo '=== workflow runner inventory ==='
          grep -R -nE 'runs-on:|integration' .github/workflows | head -n 240 || true

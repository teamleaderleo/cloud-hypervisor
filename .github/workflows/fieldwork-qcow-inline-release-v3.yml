name: Fieldwork QCOW inline old L2 release v3

on:
  push:
    branches:
      - linux-fieldwork/qcow-l2-inline-release-v2-r609

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused review follow-up
        shell: bash
        run: |
          printf '%s' '   ' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py

      - name: Format
        run: cargo fmt --all

      - name: Diff check
        run: git diff --check

      - name: Test block crate
        run: cargo test --locked -p block

      - name: Test block crate with io_uring
        run: cargo test --locked -p block --features io_uring

      - name: Clippy
        run: cargo clippy --locked -p block --lib --features io_uring -- -D warnings

      - name: Commit source-only follow-up
        shell: bash
        run: |
          git config user.name "linux-fieldwork"
          git config user.email "linux-fieldwork@users.noreply.github.com"
          git add block/src/formats/qcow/metadata.rs
          git commit -m "block: Inline old QCOW L2 release"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Fieldwork Landlock restore validator materializer

on:
  push:
    branches:
      - linux-fieldwork/landlock-restore-validation-materializer

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout materializer branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Add focused integration validator and push validation branch
        env:
          CANDIDATE_SHA: f0d19b3c3f85f06d0987f188156f97552d01f61d
          VALIDATION_BRANCH: linux-fieldwork/landlock-restore-order-v4-validation
        run: |
          set -eufo pipefail
          script="$(mktemp)"
          cp fieldwork/materialize_landlock_restore_validation.py "$script"
          git checkout --detach "$CANDIDATE_SHA"
          python3 "$script"
          cargo fmt --all
          git diff --check
          git diff -- cloud-hypervisor/tests/integration.rs

          git config user.name 'Leo'
          git config user.email 'cheerleaderleo@outlook.com'
          git add cloud-hypervisor/tests/integration.rs
          cat > /tmp/commit-message <<'EOF'
          tests: cover Landlock snapshot restore ordering

          Build one QCOW-backed snapshot, then change only its saved Landlock
          policy. Verify an unlisted backing path is denied during restore,
          explicitly allowing that path restores successfully, and the same
          allowed snapshot reaches the on-demand UFFD restore path.

          This is a Fieldwork validation carrier for the restore-order product
          candidate; it does not change VMM behavior.

          Assisted-by: ChatGPT:GPT-5.6 Sol
          Signed-off-by: Leo <cheerleaderleo@outlook.com>
          EOF
          sed -i 's/^          //' /tmp/commit-message
          git commit -F /tmp/commit-message
          git push origin "HEAD:refs/heads/$VALIDATION_BRANCH"

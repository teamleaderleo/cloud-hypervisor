name: Linux Fieldwork AArch64 max-vs-boot FDT baseline

on:
  push:
    branches:
      - linux-fieldwork/aarch64-max-boot-fdt
  pull_request:
    branches:
      - linux-fieldwork/cache-affinity-upstream-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install AArch64 probe toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          rustup target add aarch64-unknown-linux-gnu
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Apply exact prerequisites and inject test-only probes
        run: python3 linux-fieldwork/aarch64-max-boot-fdt/run_probe.py
      - name: Verify test-only scope
        run: |
          git diff --check
          git diff --name-only HEAD | tee /tmp/changed-files.txt
          test "$(wc -l < /tmp/changed-files.txt)" -eq 2
          grep -Fx 'arch/src/aarch64/fdt.rs' /tmp/changed-files.txt
          grep -Fx 'vmm/src/config.rs' /tmp/changed-files.txt
      - name: Verify accepted-config/FDT policy
        run: python3 linux-fieldwork/aarch64-max-boot-fdt/verify_policy.py | tee /tmp/aarch64-max-boot-policy.log
      - name: Verify nightly formatting
        run: cargo +nightly fmt --all -- --check
      - name: Execute AArch64 configuration validation discriminator
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: |
          set -o pipefail
          cargo test -p vmm --features kvm --target aarch64-unknown-linux-gnu \
            test_config_validation -- --nocapture 2>&1 | tee /tmp/aarch64-max-boot-config-tests.log
          grep -F 'test config::unit_tests::test_config_validation ... ok' /tmp/aarch64-max-boot-config-tests.log
      - name: Execute AArch64 FDT cpu-map domain discriminator
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: |
          set -o pipefail
          cargo test -p arch --features kvm --target aarch64-unknown-linux-gnu \
            max_boot_cpu_map_tests -- --nocapture 2>&1 | tee /tmp/aarch64-max-boot-fdt-tests.log
          grep -F 'test aarch64::fdt::max_boot_cpu_map_tests::test_max_sized_cpu_map_can_exceed_boot_cpu_node_domain ... ok' /tmp/aarch64-max-boot-fdt-tests.log
      - name: Retain baseline probe
        run: |
          git diff --binary HEAD -- arch/src/aarch64/fdt.rs vmm/src/config.rs \
            > /tmp/aarch64-max-boot-probe.patch
          sha256sum /tmp/aarch64-max-boot-probe.patch | tee /tmp/probe-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-fieldwork-aarch64-max-boot-fdt-baseline
          path: |
            /tmp/changed-files.txt
            /tmp/aarch64-max-boot-policy.log
            /tmp/aarch64-max-boot-config-tests.log
            /tmp/aarch64-max-boot-fdt-tests.log
            /tmp/aarch64-max-boot-probe.patch
            /tmp/probe-sha256.txt
          if-no-files-found: warn

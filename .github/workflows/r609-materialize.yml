name: Temporary r609 candidate materializer

on:
  push:
    branches:
      - linux-fieldwork/r609-materializer
    paths:
      - .github/workflows/r609-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CH_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      FIELDWORK_SHA: 0c440c3812326c8af7973cd45ab7a5740f34e55a
      TARGET: linux-fieldwork/qcow-l2-refcount-ownership-r609
      EXPECTED_SHA256: 3bf9ff485f9c0d90bc5da51214f9741949f9954f2e15fca6e2f1af23439db921
      EXPECTED_BLOB: 6646461c309558f1644b43921b27c0b08ecb7b5f

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CH_SHA }}
          fetch-depth: 0

      - name: Check out frozen Fieldwork materializers
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/linux-fieldwork
          ref: ${{ env.FIELDWORK_SHA }}
          path: fieldwork
          persist-credentials: false

      - name: Reconstruct exact reviewed bytes
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          python3 fieldwork/investigations/cloud-hypervisor-qcow-r609-review/apply_probe.py
          python3 fieldwork/investigations/cloud-hypervisor-qcow-r609-review/apply_candidate.py
          cargo +nightly fmt --all
          git diff --check
          test "$(git diff --name-only)" = "block/src/formats/qcow/metadata.rs"
          test "$(sha256sum block/src/formats/qcow/metadata.rs | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          test "$(git hash-object block/src/formats/qcow/metadata.rs)" = "$EXPECTED_BLOB"

      - name: Commit clean source candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add block/src/formats/qcow/metadata.rs
          git commit -m 'block: Own new QCOW L2 tables before L1 publication' \
            -m 'Give newly allocated L2 metadata clusters refcount ownership before publishing them through L1. Cover both first-table allocation and relocation, while keeping old-table release deferred.' \
            -m 'Add focused regressions for clean-reopen reuse, dropped post-publication relocation updates, and zero-marker allocation.' \
            -m 'Assisted-by: ChatGPT:GPT-5.6 Sol'
          test "$(git rev-parse HEAD^)" = "$CH_SHA"
          git diff-tree --no-commit-id --name-only -r HEAD | grep -Fx 'block/src/formats/qcow/metadata.rs'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" -eq 1
          git push origin HEAD:refs/heads/$TARGET --force-with-lease=refs/heads/$TARGET:$CH_SHA

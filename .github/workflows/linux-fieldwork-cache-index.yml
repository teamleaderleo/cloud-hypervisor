name: Linux Fieldwork AArch64 cache index portability

on:
  push:
    branches:
      - linux-fieldwork/cache-index-portability
  pull_request:
    branches:
      - linux-fieldwork/cache-index-upstream-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install AArch64 probe toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          rustup target add aarch64-unknown-linux-gnu
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Apply exact prerequisites and inject probe
        run: python3 linux-fieldwork/cache-index/run_probe.py
      - name: Verify probe-only scope
        run: |
          git diff --check
          git diff --name-only HEAD | tee /tmp/changed-files.txt
          test "$(wc -l < /tmp/changed-files.txt)" -eq 1
          grep -Fx 'arch/src/aarch64/cache.rs' /tmp/changed-files.txt
      - name: Verify nightly formatting
        run: cargo +nightly fmt --all -- --check
      - name: Execute cache-index discriminators
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: |
          set -o pipefail
          cargo test -p arch --features kvm --target aarch64-unknown-linux-gnu \
            aarch64::cache::tests::test_fixed_index_mapping -- --nocapture 2>&1 | tee /tmp/cache-index-tests.log
          grep -F 'test aarch64::cache::tests::test_fixed_index_mapping_matches_split_l1_control ... ok' /tmp/cache-index-tests.log
          grep -F 'test aarch64::cache::tests::test_fixed_index_mapping_misreads_unified_l1_fixture ... ok' /tmp/cache-index-tests.log
          grep -F 'test aarch64::cache::tests::test_fixed_index_mapping_misreads_split_l2_fixture ... ok' /tmp/cache-index-tests.log
      - name: Retain probe diff
        run: |
          git diff --binary HEAD -- arch/src/aarch64/cache.rs > /tmp/cache-index-probe.patch
          sha256sum /tmp/cache-index-probe.patch | tee /tmp/probe-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-fieldwork-cache-index-baseline
          path: |
            /tmp/changed-files.txt
            /tmp/cache-index-tests.log
            /tmp/cache-index-probe.patch
            /tmp/probe-sha256.txt
          if-no-files-found: warn

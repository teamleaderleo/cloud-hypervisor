name: Linux Fieldwork materialize current AArch64 max-vs-boot candidate

on:
  push:
    branches:
      - linux-fieldwork/materialize-aarch64-max-boot-current

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact one-file candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 1af93ac7035cda77cd87b0c18b1134ebb0928052:vmm/src/config.rs)" = "57387c4dbb0e067fe8973f6c9c4f2649d45311f5"
          git checkout --detach 1af93ac7035cda77cd87b0c18b1134ebb0928052
          cat > /tmp/candidate.patch <<'PATCH'
          diff --git a/vmm/src/config.rs b/vmm/src/config.rs
          index 57387c4db..d4d47de74 100644
          --- a/vmm/src/config.rs
          +++ b/vmm/src/config.rs
          @@ -229,6 +229,10 @@ pub enum ValidationError {
               /// Max is less than boot
               #[error("Max CPUs ({0}) lower than boot CPUs ({1})")]
               CpusMaxLowerThanBoot(u32 /* max vCPUs */, u32 /* boot vCPUs */),
          +    #[cfg(target_arch = "aarch64")]
          +    /// CPU hotplug is unsupported on AArch64.
          +    #[error("CPU hotplug is not supported on AArch64")]
          +    Aarch64CpuHotplugUnsupported,
               /// Too many CPUs.
               #[error("Too many CPUs: specified {0} but {MAX_SUPPORTED_CPUS} is the limit")]
               TooManyCpus(u32 /* specified CPUs */),
          @@ -3302,6 +3306,11 @@ impl VmConfig {
                       ));
                   }
          
          +        #[cfg(target_arch = "aarch64")]
          +        if self.cpus.max_vcpus != self.cpus.boot_vcpus {
          +            return Err(ValidationError::Aarch64CpuHotplugUnsupported);
          +        }
          +
                   if self.cpus.max_vcpus > MAX_SUPPORTED_CPUS {
                       // Note: historically, Cloud Hypervisor did not support more than 255(254 on x64)
                       // vCPUs: self.cpus.max_vcpus was of type u8, so 255 was the maximum;
          @@ -5958,6 +5967,34 @@ id=\"{id}\",pci_segment={pci_segment},queue_sizes={queue_sizes}"
                   });
                   still_valid_config.validate().unwrap();
          
          +        #[cfg(target_arch = "aarch64")]
          +        {
          +            let mut invalid_config = valid_config.clone();
          +            invalid_config.cpus.max_vcpus = 4;
          +            invalid_config.cpus.boot_vcpus = 2;
          +            invalid_config.cpus.topology = Some(CpuTopology {
          +                threads_per_core: 1,
          +                cores_per_die: 4,
          +                dies_per_package: 1,
          +                packages: 1,
          +            });
          +            assert_eq!(
          +                invalid_config.validate(),
          +                Err(ValidationError::Aarch64CpuHotplugUnsupported)
          +            );
          +
          +            let mut still_valid_config = valid_config.clone();
          +            still_valid_config.cpus.max_vcpus = 4;
          +            still_valid_config.cpus.boot_vcpus = 4;
          +            still_valid_config.cpus.topology = Some(CpuTopology {
          +                threads_per_core: 1,
          +                cores_per_die: 4,
          +                dies_per_package: 1,
          +                packages: 1,
          +            });
          +            still_valid_config.validate().unwrap();
          +        }
          +
                   #[cfg(target_arch = "x86_64")]
                   {
                       let mut invalid_config = valid_config.clone();
          PATCH
          git apply --check /tmp/candidate.patch
          git apply /tmp/candidate.patch
          git diff --check
          cargo fmt --all -- --check

      - name: Cross-check AArch64 KVM build
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          cargo check --locked -p vmm --target aarch64-unknown-linux-gnu --features kvm

      - name: Preserve x86 config behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p vmm --lib --features kvm config::tests::test_vm_config_validate
          cargo clippy --locked -p vmm --features kvm --lib -- -D warnings

      - name: Publish clean source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Leo
          git config user.email cheerleaderleo@outlook.com
          git add vmm/src/config.rs
          git commit -s -m 'vmm: reject unsupported AArch64 CPU hotplug config' -m 'AArch64 firmware describes the boot CPU set while CPU device hotplug is not supported there. Reject configurations whose maximum vCPU count differs from the boot count so firmware topology cannot reference CPUs that will never be created.'
          test "$(git rev-parse HEAD^)" = "1af93ac7035cda77cd87b0c18b1134ebb0928052"
          test "$(git diff --name-only 1af93ac7035cda77cd87b0c18b1134ebb0928052..HEAD)" = "vmm/src/config.rs"
          git push origin +HEAD:refs/heads/linux-fieldwork/aarch64-max-boot-current-source

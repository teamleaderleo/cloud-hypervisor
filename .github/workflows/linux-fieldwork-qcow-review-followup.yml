name: Linux Fieldwork QCOW review follow-up

on:
  push:
    branches:
      - linux-fieldwork/qcow-l2-review-followup-r609

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply review follow-up
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path("block/src/formats/qcow/metadata.rs")
          text = path.read_text()

          old_comment = "                // Allocate and own the new L2 table before publishing it through L1."
          new_comment = "                // Set the new L2 table's refcount to 1 before the L1 entry points at it."
          assert text.count(old_comment) == 1
          text = text.replace(old_comment, new_comment)

          old_expect = '            .expect("reopen should retain at least one reusable cluster");'
          new_expect = '            .expect("allocator should return a cluster other than live_l2");'
          assert text.count(old_expect) == 1
          text = text.replace(old_expect, new_expect)

          anchor = "    #[test]\n    fn zero_marker_fresh_l2_keeps_refcount_owner() {"
          assert text.count(anchor) == 1
          success_test = base64.b64decode("").decode()
          text = text.replace(anchor, success_test + anchor)
          path.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Run block tests
        run: cargo test --locked -p block

      - name: Check diff
        run: git diff --check

      - name: Commit tested source follow-up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add block/src/formats/qcow/metadata.rs
          git diff --cached --quiet && exit 0
          git commit -m "fieldwork: apply QCOW review follow-up"
          git push origin HEAD:linux-fieldwork/qcow-l2-review-followup-r609

name: Linux Fieldwork materialize SMBIOS embedded-NUL candidate

on:
  push:
    branches:
      - linux-fieldwork/materialize-smbios-nul-r595
    paths:
      - .github/workflows/linux-fieldwork-materialize-smbios-nul-r595.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CH_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      OUT_BRANCH: linux-fieldwork/review-smbios-nul-r595
      TEST: x86_64::smbios::unit_tests::smbios_embedded_nul_string_is_rejected
    steps:
      - name: Check out exact Cloud Hypervisor source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CH_SHA }}
          path: cloud-hypervisor
          persist-credentials: true

      - name: Pin source and toolchain
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$CH_SHA"
          test -z "$(git status --short)"
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 rustfmt clippy
          rustup override set 1.89.0
          rustc --version

      - name: Materialize exact reviewed candidate
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('arch/src/x86_64/smbios.rs')
          s = p.read_text()
          old = '''    /// SMBIOS string index overflow (u8 limit reached).\n    #[error("SMBIOS string index overflow (u8 limit reached: {})", u8::MAX)]\n    TooManyStrings,\n}'''
          new = '''    /// SMBIOS string index overflow (u8 limit reached).\n    #[error("SMBIOS string index overflow (u8 limit reached: {})", u8::MAX)]\n    TooManyStrings,\n    /// SMBIOS strings cannot contain an embedded NUL byte.\n    #[error("SMBIOS string contains an embedded NUL byte")]\n    StringContainsNul,\n}'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''fn write_string(\n    mem: &GuestMemoryMmap,\n    val: &str,\n    mut curptr: GuestAddress,\n) -> Result<GuestAddress> {\n    for c in val.as_bytes().iter() {'''
          new = '''fn write_string(\n    mem: &GuestMemoryMmap,\n    val: &str,\n    mut curptr: GuestAddress,\n) -> Result<GuestAddress> {\n    if val.as_bytes().contains(&0) {\n        return Err(Error::StringContainsNul);\n    }\n    for c in val.as_bytes().iter() {'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          anchor = '''    #[test]\n    fn smbios_uuid_invalid_rejected() {\n'''
          test = '''    #[test]\n    fn smbios_embedded_nul_string_is_rejected() {\n        let mem = GuestMemoryMmap::from_ranges(&[(GuestAddress(SMBIOS_START), 4096)]).unwrap();\n        let smbios = SmbiosConfig {\n            system: Some(SmbiosSystem {\n                manufacturer: Some("maker\\0shadow".to_string()),\n                ..Default::default()\n            }),\n            ..Default::default()\n        };\n\n        let err = setup_smbios(&mem, Some(&smbios)).unwrap_err();\n        assert!(matches!(err, Error::StringContainsNul));\n    }\n\n'''
          assert s.count(anchor) == 1
          p.write_text(s.replace(anchor, test + anchor, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only)" = "arch/src/x86_64/smbios.rs"
          git diff -- arch/src/x86_64/smbios.rs | tee ../r595-review.diff

      - name: Execute focused and full arch tests
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p arch --features kvm --lib -- --list | tee ../r595-test-list.txt
          grep -F "$TEST: test" ../r595-test-list.txt
          cargo test --locked -p arch --features kvm --lib "$TEST" -- --exact --nocapture 2>&1 | tee ../r595-focused.log
          cargo test --locked -p arch --features kvm --lib 2>&1 | tee ../r595-arch-suite.log

      - name: Quality gates
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo clippy --locked -p arch --features kvm --all-targets -- -D warnings 2>&1 | tee ../r595-clippy.log
          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only)" = "arch/src/x86_64/smbios.rs"

      - name: Commit and publish clean review branch
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Leo"
          git config user.email "cheerleaderleo@outlook.com"
          git switch -c "$OUT_BRANCH"
          git add arch/src/x86_64/smbios.rs
          git commit -s -m "arch: Reject embedded NUL in SMBIOS strings" -m "Reject configured SMBIOS strings containing a NUL byte before serialization can retarget fixed string indices. Add a focused Type 1 regression." -m "Assisted-by: ChatGPT:GPT-5.6 Sol"
          test "$(git rev-list --count "$CH_SHA"..HEAD)" = 1
          test "$(git diff --name-only "$CH_SHA"...HEAD)" = "arch/src/x86_64/smbios.rs"
          git push --force-with-lease origin "HEAD:refs/heads/$OUT_BRANCH"
          git rev-parse HEAD | tee ../r595-review-head.txt
          git rev-parse HEAD^{tree} | tee ../r595-review-tree.txt

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smbios-nul-r595-review
          if-no-files-found: warn
          path: |
            r595-review.diff
            r595-test-list.txt
            r595-focused.log
            r595-arch-suite.log
            r595-clippy.log
            r595-review-head.txt
            r595-review-tree.txt

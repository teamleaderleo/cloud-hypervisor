name: Linux Fieldwork materialize repaired TDVF section type

on:
  push:
    branches:
      - linux-fieldwork/materialize-tdvf-section-type-r590t-v2
    paths:
      - .github/workflows/linux-fieldwork-materialize-tdvf-section-type-r590t-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      SOURCE_HEAD: 19fa932e1faa1f05c588813484f1750b9dd41161
      TARGET_BRANCH: linux-fieldwork/review-tdvf-section-type-r590t
    steps:
      - name: Check out controlled fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to reviewed source head
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" -eq 1

      - name: Apply review repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('arch/src/x86_64/tdx/mod.rs')
          s = p.read_text()

          old_len = '''    if descriptor.length as usize
              != size_of::<TdvfDescriptor>() + size_of::<TdvfSection>() * descriptor.num_sections as usize
          {
          '''
          new_len = '''    if descriptor.length as usize
              != size_of::<TdvfDescriptor>()
                  + size_of::<RawTdvfSection>() * descriptor.num_sections as usize
          {
          '''
          if s.count(old_len) != 1:
              raise SystemExit(f'unexpected descriptor length check count: {s.count(old_len)}')
          s = s.replace(old_len, new_len, 1)

          old_size_assert = '        assert_eq!(size_of::<RawTdvfSection>(), size_of::<TdvfSection>());\n'
          new_size_assert = '        assert_eq!(size_of::<RawTdvfSection>(), 32);\n'
          if s.count(old_size_assert) != 1:
              raise SystemExit('unexpected raw/typed size assertion count')
          s = s.replace(old_size_assert, new_size_assert, 1)

          old_control = '''            let section_type = sections[0].r#type;
              println!("TDVF_TYPE_CANDIDATE control raw_type={raw_type:#x} type={section_type:?}");
          '''
          new_control = '''            let section_type = sections[0].r#type;
              println!("TDVF_TYPE_CANDIDATE control raw_type={raw_type:#x} type={section_type:?}");
              assert_eq!(section_type as u32, raw_type);
          '''
          if s.count(old_control) != 1:
              raise SystemExit('unexpected represented-type control count')
          s = s.replace(old_control, new_control, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only)" = "arch/src/x86_64/tdx/mod.rs"
          git diff -- arch/src/x86_64/tdx/mod.rs

      - name: Pin toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 rustfmt clippy
          rustup override set 1.89.0

      - name: Validate focused and broad TDVF gates
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p arch --features tdx,kvm --lib tdvf_unknown_section_type_is_rejected -- --exact --nocapture
          cargo test --locked -p arch --features tdx,kvm --lib tdvf_known_and_reserved_section_types_are_validated -- --exact --nocapture
          cargo test --locked -p arch --features tdx,kvm --lib
          cargo test --locked -p hypervisor --features tdx,kvm --lib
          cargo clippy --locked -p arch --features tdx,kvm --all-targets -- -D warnings
          cargo fmt --all -- --check
          git diff --check

      - name: Amend one clean source commit
        run: |
          set -euo pipefail
          git config user.name Leo
          git config user.email cheerleaderleo@outlook.com
          git add arch/src/x86_64/tdx/mod.rs
          git commit --amend --no-edit
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" -eq 1
          test "$(git diff --name-only "$BASE_SHA"..HEAD)" = "arch/src/x86_64/tdx/mod.rs"
          git log -1 --format=%B | grep -F 'Signed-off-by: Leo <cheerleaderleo@outlook.com>'

      - name: Publish clean review branch
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/$TARGET_BRANCH"

name: Linux Fieldwork AArch64 cache sharing candidate

on:
  push:
    branches:
      - linux-fieldwork/cache-sharing-pptt
  pull_request:
    branches:
      - linux-fieldwork/cache-sharing-upstream-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install candidate toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          rustup target add aarch64-unknown-linux-gnu
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Apply exact prerequisites, fixtures, and candidate
        run: python3 linux-fieldwork/cache-sharing/run_candidate.py
      - name: Verify one-file product scope
        run: |
          git diff --check
          git diff --name-only HEAD | tee /tmp/changed-files.txt
          test "$(wc -l < /tmp/changed-files.txt)" -eq 1
          grep -Fx 'vmm/src/cpu.rs' /tmp/changed-files.txt
      - name: Verify FDT and PPTT candidate policy
        run: python3 linux-fieldwork/cache-sharing/verify_candidate.py | tee /tmp/cache-sharing-candidate-policy.log
      - name: Verify nightly formatting
        run: cargo +nightly fmt --all -- --check
      - name: Execute all AArch64 cache fixtures
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: |
          set -o pipefail
          cargo test -p arch --features kvm --target aarch64-unknown-linux-gnu aarch64::cache::tests -- --nocapture \
            2>&1 | tee /tmp/cache-sharing-candidate-tests.log
          grep -F 'test aarch64::cache::tests::test_shared_l2_layout_is_returned_with_shared_flag ... ok' /tmp/cache-sharing-candidate-tests.log
          grep -F 'test aarch64::cache::tests::test_private_l3_layout_is_returned_with_private_flag ... ok' /tmp/cache-sharing-candidate-tests.log
          grep -F 'test aarch64::cache::tests::test_split_l1_control_preserves_mapping ... ok' /tmp/cache-sharing-candidate-tests.log
      - name: Clean cache-test rerun
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: cargo test -p arch --features kvm --target aarch64-unknown-linux-gnu aarch64::cache::tests
      - name: Focused AArch64 Clippy
        run: cargo clippy -p vmm --all-targets --features kvm --target aarch64-unknown-linux-gnu -- -D warnings
      - name: AArch64 KVM vmm compile
        run: cargo check -p vmm --features kvm --target aarch64-unknown-linux-gnu
      - name: AArch64 MSHV vmm compile
        run: cargo check -p vmm --features mshv --target aarch64-unknown-linux-gnu
      - name: x86_64 KVM regression Clippy
        run: cargo clippy -p vmm --all-targets --features kvm -- -D warnings
      - name: Retain and verify exact product diff
        run: |
          git diff --binary HEAD -- vmm/src/cpu.rs > /tmp/cache-sharing-candidate.patch
          cmp linux-fieldwork/cache-sharing/candidate.patch /tmp/cache-sharing-candidate.patch
          echo '8729ff3d3c106768b536fbfb674f6cdbb0771d133c62e3d2c05de47012eed014  linux-fieldwork/cache-sharing/candidate.patch' | sha256sum -c -
          echo '8729ff3d3c106768b536fbfb674f6cdbb0771d133c62e3d2c05de47012eed014  /tmp/cache-sharing-candidate.patch' | sha256sum -c -
          sha256sum linux-fieldwork/cache-sharing/candidate.patch /tmp/cache-sharing-candidate.patch | tee /tmp/candidate-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-fieldwork-cache-sharing-candidate
          path: |
            /tmp/changed-files.txt
            /tmp/cache-sharing-candidate-policy.log
            /tmp/cache-sharing-candidate-tests.log
            /tmp/cache-sharing-candidate.patch
            /tmp/candidate-sha256.txt
          if-no-files-found: warn

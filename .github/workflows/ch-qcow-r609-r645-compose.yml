name: QCOW r609 r645 composition probe

on:
  push:
    branches:
      - research/ch-qcow-r609-r645-compose
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out composition base
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchains
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.89.0 --profile minimal --component clippy
          rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Materialize cache-eviction candidate over PR 8721 head
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin linux-fieldwork/review-qcow-cache-eviction-r645

          # The old #645 metadata hunk conflicts conceptually with the newer #8721
          # ownership ordering. Apply only the independent cache/refcount pieces,
          # then materialize the combined metadata ordering explicitly below.
          git show 29a3bb535b4825540d612fdc6691d203f7cd09ef --format= -- \
            block/src/formats/qcow/refcount.rs \
            block/src/formats/qcow/vec_cache.rs | git apply --index

          python3 - <<'PY'
          from pathlib import Path

          path = Path("block/src/formats/qcow/metadata.rs")
          text = path.read_text()
          start = text.index("    fn cache_l2_cluster_alloc")
          end = text.index("    /// Allocates a new cluster", start)
          old = text[start:end]
          required = [
              "get_new_cluster(None)?",
              "set_cluster_refcount_track_freed(new_addr, 1)?",
              "self.l1_table[l1_index] = new_addr",
              "self.l2_cache.insert",
          ]
          for needle in required:
              if needle not in old:
                  raise SystemExit(f"PR 8721 helper missing expected operation: {needle}")

          new = '''    fn cache_l2_cluster_alloc(&mut self, l1_index: usize, l2_addr_disk: u64) -> io::Result<()> {
    if !self.l2_cache.contains_key(l1_index) {
        let (l2_table, new_addr) = if l2_addr_disk == 0 {
            // Own the new L2 before any fallible cache eviction, and publish it
            // through L1 only after cache insertion succeeds.
            let new_addr = self.get_new_cluster(None)?;
            self.set_cluster_refcount_track_freed(new_addr, 1)?;
            (VecCache::new(self.l2_entries as usize), Some(new_addr))
        } else {
            self.reject_invalid_cluster_offset(l2_addr_disk)?;
            (
                VecCache::from_vec(self.raw_file.read_pointer_cluster(l2_addr_disk, None)?),
                None,
            )
        };
        let l1_table = &self.l1_table;
        let raw_file = &mut self.raw_file;
        self.l2_cache.insert(l1_index, l2_table, |index, evicted| {
            raw_file.write_pointer_table_direct(l1_table[index], evicted.iter())
        })?;
        if let Some(new_addr) = new_addr {
            self.l1_table[l1_index] = new_addr;
        }
    }
    Ok(())
}

'''
          path.write_text(text[:start] + new + text[end:])
          PY

          # Normalize both the generated helper and the older candidate's test imports
          # before freezing the composition diff.
          cargo +nightly fmt --all
          git add \
            block/src/formats/qcow/metadata.rs \
            block/src/formats/qcow/refcount.rs \
            block/src/formats/qcow/vec_cache.rs
          git diff --cached --check
          git diff --cached -- block/src/formats/qcow > /tmp/r609-r645-compose.diff
          sha256sum /tmp/r609-r645-compose.diff | tee /tmp/r609-r645-compose.sha256

      - name: Verify combined publication order
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path("block/src/formats/qcow/metadata.rs").read_text()
          start = text.index("fn cache_l2_cluster_alloc")
          end = text.index("/// Allocates a new cluster", start)
          helper = text[start:end]
          allocate = helper.index("get_new_cluster(None)?")
          own = helper.index("set_cluster_refcount_track_freed(new_addr, 1)?")
          insert = helper.index("self.l2_cache.insert")
          publish = helper.index("self.l1_table[l1_index] = new_addr")
          assert allocate < own < insert < publish, (allocate, own, insert, publish)
          print("COMPOSE_ORDER allocate < refcount=1 < cache insert < L1 publish")
          PY

      - name: Focused composition regressions
        shell: bash
        run: |
          set -euxo pipefail
          : > /tmp/r609-r645-compose.log
          cargo +1.89.0 test --locked -p block --lib \
            formats::qcow::vec_cache::unit_tests::failed_eviction_keeps_dirty_victim \
            -- --exact --nocapture 2>&1 | tee -a /tmp/r609-r645-compose.log
          cargo +1.89.0 test --locked -p block --lib \
            formats::qcow::refcount::eviction_error_candidate_unit_tests::failed_refblock_eviction_keeps_dirty_victim_and_old_pointer \
            -- --exact --nocapture 2>&1 | tee -a /tmp/r609-r645-compose.log
          cargo +1.89.0 test --locked -p block --lib \
            formats::qcow::metadata::unit_tests::fresh_l2_enospc_reopen_does_not_reuse_live_table \
            -- --exact --nocapture 2>&1 | tee -a /tmp/r609-r645-compose.log
          cargo +1.89.0 test --locked -p block --lib \
            formats::qcow::metadata::unit_tests::successful_l2_relocation_releases_old_table \
            -- --exact --nocapture 2>&1 | tee -a /tmp/r609-r645-compose.log
          cargo +1.89.0 test --locked -p block --lib \
            formats::qcow::metadata::unit_tests::zero_marker_fresh_l2_keeps_refcount_owner \
            -- --exact --nocapture 2>&1 | tee -a /tmp/r609-r645-compose.log

      - name: Block suites and quality gates
        shell: bash
        run: |
          set -euxo pipefail
          cargo +1.89.0 test --locked -p block 2>&1 | tee -a /tmp/r609-r645-compose.log
          cargo +1.89.0 test --locked -p block --features io_uring 2>&1 | tee -a /tmp/r609-r645-compose.log
          cargo +1.89.0 clippy --locked -p block --features io_uring --all-targets --tests -- -D warnings 2>&1 | tee -a /tmp/r609-r645-compose.log
          cargo +nightly fmt --all -- --check 2>&1 | tee -a /tmp/r609-r645-compose.log
          git diff --cached --check

      - name: Record receipt
        if: always()
        shell: bash
        run: |
          {
            echo "base=284a2d42b98c514f57d3e89240861196d94fc6cb"
            echo "cache_candidate=29a3bb535b4825540d612fdc6691d203f7cd09ef"
            echo "runner_head=$(git rev-parse HEAD)"
            git status --short
            if [ -f /tmp/r609-r645-compose.sha256 ]; then
              cat /tmp/r609-r645-compose.sha256
            fi
          } > /tmp/r609-r645-compose-receipt.txt

      - name: Upload composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch-qcow-r609-r645-compose
          path: |
            /tmp/r609-r645-compose.diff
            /tmp/r609-r645-compose.sha256
            /tmp/r609-r645-compose.log
            /tmp/r609-r645-compose-receipt.txt
          if-no-files-found: warn

name: Linux Fieldwork AArch64 cache errors

on:
  push:
    branches:
      - linux-fieldwork/cache-runtime-errors
  pull_request:
    branches:
      - linux-fieldwork/cache-error-upstream-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Preflight stored patch portability from clean canonical source
        run: |
          set -euxo pipefail
          sha256sum linux-fieldwork/cache-errors/candidate.patch linux-fieldwork/cache-errors/propagation.patch
          git apply --numstat linux-fieldwork/cache-errors/candidate.patch
          git apply --numstat linux-fieldwork/cache-errors/propagation.patch

          git fetch --no-tags --depth=100 origin fix/8666-acpi-errors
          test "$(git rev-parse FETCH_HEAD)" = "e9c86bacee14a2fd6fe871dc678c6b3f1ac4012a"
          git diff --name-only \
            a1fcb9f790616ac615f66de73be540b0b20844b1 \
            e9c86bacee14a2fd6fe871dc678c6b3f1ac4012a \
            -- vmm/src/acpi.rs vmm/src/vm.rs | tee /tmp/acpi-prerequisite-files.txt
          test "$(cat /tmp/acpi-prerequisite-files.txt)" = $'vmm/src/acpi.rs\nvmm/src/vm.rs'
          git diff --binary \
            a1fcb9f790616ac615f66de73be540b0b20844b1 \
            e9c86bacee14a2fd6fe871dc678c6b3f1ac4012a \
            -- vmm/src/acpi.rs vmm/src/vm.rs > /tmp/acpi.patch
          sha256sum /tmp/acpi.patch | tee /tmp/acpi-prerequisite-sha256.txt

          rm -rf /tmp/cache-errors-preflight
          git worktree add --detach /tmp/cache-errors-preflight a1fcb9f790616ac615f66de73be540b0b20844b1
          cp linux-fieldwork/cache-errors/candidate.patch /tmp/cache-parser-stored.patch
          cp linux-fieldwork/cache-errors/propagation.patch /tmp/cache-propagation-stored.patch
          (
            cd /tmp/cache-errors-preflight
            git apply --check /tmp/acpi.patch
            git apply /tmp/acpi.patch
            git apply --check /tmp/cache-parser-stored.patch
            git apply /tmp/cache-parser-stored.patch
            git apply --check /tmp/cache-propagation-stored.patch
          )
      - name: Install candidate toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          rustup target add aarch64-unknown-linux-gnu
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Apply exact stacked candidate
        run: python3 linux-fieldwork/cache-errors/run_candidate.py
      - name: Verify successor scope
        run: |
          git diff --check
          git diff --name-only HEAD | tee /tmp/changed-files.txt
          test "$(wc -l < /tmp/changed-files.txt)" -eq 5
          grep -Fx 'arch/src/aarch64/cache.rs' /tmp/changed-files.txt
          grep -Fx 'arch/src/aarch64/fdt.rs' /tmp/changed-files.txt
          grep -Fx 'arch/src/aarch64/mod.rs' /tmp/changed-files.txt
          grep -Fx 'vmm/src/acpi.rs' /tmp/changed-files.txt
          grep -Fx 'vmm/src/cpu.rs' /tmp/changed-files.txt
      - name: Verify nightly formatting
        run: cargo +nightly fmt --all -- --check
      - name: Execute AArch64 cache fixtures
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: |
          set -o pipefail
          cargo test -p arch --features kvm --target aarch64-unknown-linux-gnu aarch64::cache::tests -- --nocapture 2>&1 | tee /tmp/cache-tests.log
          grep -F 'test aarch64::cache::tests::test_missing_cache_root ... ok' /tmp/cache-tests.log
          grep -F 'test aarch64::cache::tests::test_missing_cache_properties_use_defaults ... ok' /tmp/cache-tests.log
          grep -F 'test aarch64::cache::tests::test_valid_cache_properties ... ok' /tmp/cache-tests.log
          grep -F 'test aarch64::cache::tests::test_malformed_cache_size_is_error ... ok' /tmp/cache-tests.log
          grep -F 'test aarch64::cache::tests::test_malformed_decimal_is_error ... ok' /tmp/cache-tests.log
          grep -F 'test aarch64::cache::tests::test_cache_property_io_error_is_error ... ok' /tmp/cache-tests.log
          grep -F 'test aarch64::cache::tests::test_cache_size_overflow_is_error ... ok' /tmp/cache-tests.log
      - name: Clean fixture rerun
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: cargo test -p arch --features kvm --target aarch64-unknown-linux-gnu aarch64::cache::tests
      - name: Focused AArch64 Clippy
        run: |
          cargo clippy -p arch --all-targets --features kvm --target aarch64-unknown-linux-gnu -- -D warnings
          cargo clippy -p vmm --all-targets --features kvm --target aarch64-unknown-linux-gnu -- -D warnings
      - name: AArch64 KVM vmm compile
        run: cargo check -p vmm --features kvm --target aarch64-unknown-linux-gnu
      - name: AArch64 MSHV vmm compile
        run: cargo check -p vmm --features mshv --target aarch64-unknown-linux-gnu
      - name: x86_64 KVM regression Clippy
        run: cargo clippy -p vmm --all-targets --features kvm -- -D warnings
      - name: Retain and verify exact successor diffs
        run: |
          git diff --binary --full-index HEAD -- arch/src/aarch64/cache.rs > /tmp/cache-parser.patch
          git diff --binary --full-index HEAD -- arch/src/aarch64/fdt.rs arch/src/aarch64/mod.rs vmm/src/cpu.rs vmm/src/acpi.rs > /tmp/cache-propagation.patch
          sha256sum \
            linux-fieldwork/cache-errors/candidate.patch \
            /tmp/cache-parser.patch \
            linux-fieldwork/cache-errors/propagation.patch \
            /tmp/cache-propagation.patch | tee /tmp/candidate-sha256.txt
          cmp linux-fieldwork/cache-errors/candidate.patch /tmp/cache-parser.patch
          cmp linux-fieldwork/cache-errors/propagation.patch /tmp/cache-propagation.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-fieldwork-cache-errors-candidate
          path: |
            /tmp/acpi-prerequisite-files.txt
            /tmp/acpi-prerequisite-sha256.txt
            /tmp/changed-files.txt
            /tmp/cache-tests.log
            /tmp/cache-parser.patch
            /tmp/cache-propagation.patch
            /tmp/candidate-sha256.txt
          if-no-files-found: warn

name: Fieldwork dirty-log streaming successor materialization

on:
  push:
    branches:
      - materialize/kvm-dirty-log-streaming-successor
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact signed candidate and apply streaming repair
        shell: bash
        run: |
          set -euo pipefail
          cp .fieldwork/dirty-log-streaming.patch /tmp/dirty-log-streaming.patch
          git reset --hard 2038c3cb262ac27604f647729557893a61510f99
          test "$(git rev-parse HEAD)" = 2038c3cb262ac27604f647729557893a61510f99
          git apply --check /tmp/dirty-log-streaming.patch
          git apply /tmp/dirty-log-streaming.patch
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only)" = "vmm/src/memory_manager.rs"

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-x86-64-linux-gnu
          rustup target add x86_64-unknown-linux-gnu
          cargo test -p vmm --features kvm dirty_log -- --nocapture
          cargo test -p vm-migration test_memory_range_table_from_dirty_ranges_iter -- --nocapture
          cargo check -p vmm --features kvm
          cargo check -p vmm --features mshv --target x86_64-unknown-linux-gnu
          cargo clippy -p vmm --features kvm --all-targets --tests -- -D warnings
          cargo clippy -p vmm --features mshv --target x86_64-unknown-linux-gnu --all-targets --tests -- -D warnings

      - name: Publish clean successor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "vmm/src/memory_manager.rs"
          grep -Fq '.map(|(vm, vmm)| vm | vmm);' vmm/src/memory_manager.rs
          if grep -A5 -F 'let dirty_bitmap = vm_dirty_log' vmm/src/memory_manager.rs | grep -Fq 'collect::<Vec<_>>()'; then
            echo 'merged dirty bitmap still materialized' >&2
            exit 1
          fi
          git config user.name 'Leo Li'
          git config user.email 'cheerleaderleo@outlook.com'
          git add vmm/src/memory_manager.rs
          git commit -m 'vmm: stream merged dirty log bitmap' -m 'Avoid materializing a second full merged dirty bitmap during migration. Validate tail padding directly from the backend and VMM final words, then pass the lazy OR iterator into range conversion. Extend the padding-bit regression to cover invalid bits from either source.' -m 'Assisted-by: ChatGPT:GPT-5.6 Sol' -m 'Signed-off-by: Leo Li <cheerleaderleo@outlook.com>'
          git push origin HEAD:refs/heads/candidate/kvm-dirty-log-granule-streaming --force

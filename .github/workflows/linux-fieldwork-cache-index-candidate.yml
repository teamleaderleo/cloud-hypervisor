name: Linux Fieldwork AArch64 cache identity candidate

on:
  push:
    branches:
      - linux-fieldwork/cache-index-portability
  pull_request:
    branches:
      - linux-fieldwork/cache-index-upstream-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install AArch64 candidate toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          rustup target add aarch64-unknown-linux-gnu
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Apply exact prerequisites and exact candidate
        run: python3 linux-fieldwork/cache-index/run_candidate.py
      - name: Verify one-file product scope
        run: |
          git diff --check
          git diff --name-only HEAD | tee /tmp/changed-files.txt
          test "$(wc -l < /tmp/changed-files.txt)" -eq 1
          grep -Fx 'arch/src/aarch64/cache.rs' /tmp/changed-files.txt
      - name: Verify nightly formatting
        run: cargo +nightly fmt --all -- --check
      - name: Execute all AArch64 cache tests
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: |
          set -o pipefail
          cargo test -p arch --features kvm --target aarch64-unknown-linux-gnu aarch64::cache::tests -- --nocapture 2>&1 | tee /tmp/cache-index-candidate-tests.log
          grep -F 'test aarch64::cache::tests::test_split_l1_control_preserves_mapping ... ok' /tmp/cache-index-candidate-tests.log
          grep -F 'test aarch64::cache::tests::test_unified_l1_is_omitted ... ok' /tmp/cache-index-candidate-tests.log
          grep -F 'test aarch64::cache::tests::test_split_l2_is_omitted ... ok' /tmp/cache-index-candidate-tests.log
          grep -F 'test aarch64::cache::tests::test_higher_cache_level_does_not_shift_mapping ... ok' /tmp/cache-index-candidate-tests.log
          grep -F 'test aarch64::cache::tests::test_missing_cache_identity_is_error ... ok' /tmp/cache-index-candidate-tests.log
          grep -F 'test aarch64::cache::tests::test_invalid_cache_type_is_error ... ok' /tmp/cache-index-candidate-tests.log
          grep -F 'test aarch64::cache::tests::test_malformed_cache_size_is_error ... ok' /tmp/cache-index-candidate-tests.log
          grep -F 'test aarch64::cache::tests::test_cache_property_io_error_is_error ... ok' /tmp/cache-index-candidate-tests.log
      - name: Clean cache-test rerun
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: cargo test -p arch --features kvm --target aarch64-unknown-linux-gnu aarch64::cache::tests
      - name: Focused AArch64 Clippy
        run: cargo clippy -p arch --all-targets --features kvm --target aarch64-unknown-linux-gnu -- -D warnings
      - name: AArch64 KVM vmm compile
        run: cargo check -p vmm --features kvm --target aarch64-unknown-linux-gnu
      - name: AArch64 MSHV vmm compile
        run: cargo check -p vmm --features mshv --target aarch64-unknown-linux-gnu
      - name: x86_64 KVM regression Clippy
        run: cargo clippy -p vmm --all-targets --features kvm -- -D warnings
      - name: Retain and verify exact candidate diff
        run: |
          git diff --binary --full-index HEAD -- arch/src/aarch64/cache.rs > /tmp/cache-index-candidate.patch
          echo 'c3c0b19e8025fa8b1f90d9b2378165676f877fe2572c52b62e3ab1871e13e1e9  linux-fieldwork/cache-index/candidate.patch' | sha256sum -c -
          echo 'ee57a555a56792604f7128304fe5658f7ff6198b2f3e9961b41a1fff515d89fe  /tmp/cache-index-candidate.patch' | sha256sum -c -
          git patch-id --stable < linux-fieldwork/cache-index/candidate.patch | awk '{print $1}' > /tmp/stored-patch-id.txt
          git patch-id --stable < /tmp/cache-index-candidate.patch | awk '{print $1}' > /tmp/generated-patch-id.txt
          cmp /tmp/stored-patch-id.txt /tmp/generated-patch-id.txt
          sha256sum linux-fieldwork/cache-index/candidate.patch /tmp/cache-index-candidate.patch | tee /tmp/candidate-sha256.txt
          cat /tmp/stored-patch-id.txt /tmp/generated-patch-id.txt | tee /tmp/candidate-patch-ids.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-fieldwork-cache-index-candidate
          path: |
            /tmp/changed-files.txt
            /tmp/cache-index-candidate-tests.log
            /tmp/cache-index-candidate.patch
            /tmp/candidate-sha256.txt
            /tmp/candidate-patch-ids.txt
          if-no-files-found: warn

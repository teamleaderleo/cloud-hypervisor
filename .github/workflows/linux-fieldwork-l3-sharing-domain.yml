name: Linux Fieldwork AArch64 L3 sharing-domain baseline

on:
  push:
    branches:
      - linux-fieldwork/l3-sharing-domain
  pull_request:
    branches:
      - linux-fieldwork/cache-affinity-upstream-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install AArch64 probe toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          rustup target add aarch64-unknown-linux-gnu
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Apply exact prerequisites and inject test-only probe
        run: python3 linux-fieldwork/l3-sharing-domain/run_probe.py
      - name: Verify test-only scope
        run: |
          git diff --check
          git diff --name-only HEAD | tee /tmp/changed-files.txt
          test "$(wc -l < /tmp/changed-files.txt)" -eq 1
          grep -Fx 'arch/src/aarch64/cache.rs' /tmp/changed-files.txt
      - name: Verify L3 domain policy gap
        run: python3 linux-fieldwork/l3-sharing-domain/verify_policy.py | tee /tmp/l3-sharing-domain-policy.log
      - name: Verify nightly formatting
        run: cargo +nightly fmt --all -- --check
      - name: Execute AArch64 L3 sharing-domain discriminator
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: |
          set -o pipefail
          cargo test -p arch --features kvm --target aarch64-unknown-linux-gnu \
            test_common_topology_loses_distinct_l3_sharing_domains -- --nocapture \
            2>&1 | tee /tmp/l3-sharing-domain-tests.log
          grep -F 'test aarch64::cache::tests::test_common_topology_loses_distinct_l3_sharing_domains ... ok' /tmp/l3-sharing-domain-tests.log
      - name: Retain baseline probe
        run: |
          git diff --binary HEAD -- arch/src/aarch64/cache.rs > /tmp/l3-sharing-domain-probe.patch
          sha256sum /tmp/l3-sharing-domain-probe.patch | tee /tmp/probe-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-fieldwork-l3-sharing-domain-baseline
          path: |
            /tmp/changed-files.txt
            /tmp/l3-sharing-domain-policy.log
            /tmp/l3-sharing-domain-tests.log
            /tmp/l3-sharing-domain-probe.patch
            /tmp/probe-sha256.txt
          if-no-files-found: warn

name: Linux Fieldwork ACPI errors

on:
  push:
    branches:
      - linux-fieldwork/acpi-error-propagation
  pull_request:
    branches:
      - linux-fieldwork/acpi-error-upstream-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply exact-source candidate
        run: python3 linux-fieldwork/acpi-errors/run_candidate.py
      - name: Verify candidate scope
        run: |
          git diff --check
          git diff --name-only | tee /tmp/changed-files.txt
          test "$(wc -l < /tmp/changed-files.txt)" -eq 2
          grep -Fx 'vmm/src/acpi.rs' /tmp/changed-files.txt
          grep -Fx 'vmm/src/vm.rs' /tmp/changed-files.txt
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Focused arithmetic unit test
        run: |
          set -o pipefail
          cargo test -p vmm --features kvm acpi::tests::test_next_table_address -- --exact 2>&1 | tee /tmp/acpi-test.log
          grep -F 'test acpi::tests::test_next_table_address ... ok' /tmp/acpi-test.log
      - name: Focused Clippy
        run: cargo clippy -p vmm --all-targets --features kvm,fw_cfg,tdx -- -D warnings
      - name: KVM vmm compile
        run: cargo check -p vmm --features kvm
      - name: MSHV vmm compile
        run: cargo check -p vmm --features mshv
      - name: fw_cfg vmm compile
        run: cargo check -p vmm --features kvm,fw_cfg
      - name: TDX vmm compile
        run: cargo check -p vmm --features kvm,tdx
      - name: aarch64 vmm compile
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          cargo check -p vmm --features kvm --target aarch64-unknown-linux-gnu
          cargo check -p vmm --features mshv --target aarch64-unknown-linux-gnu
      - name: Retain and verify candidate diff
        run: |
          git diff --binary > /tmp/acpi-error-propagation.patch
          cmp linux-fieldwork/acpi-errors/candidate.patch /tmp/acpi-error-propagation.patch
          sha256sum linux-fieldwork/acpi-errors/candidate.patch /tmp/acpi-error-propagation.patch | tee /tmp/candidate-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-fieldwork-acpi-error-candidate
          path: |
            /tmp/acpi-error-propagation.patch
            /tmp/changed-files.txt
            /tmp/candidate-sha256.txt
          if-no-files-found: warn

name: Fieldwork Landlock restore-order materializer

on:
  push:
    branches:
      - linux-fieldwork/landlock-restore-order-materializer

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout materializer branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact source substitutions and push candidate
        env:
          BASE_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
          CANDIDATE_BRANCH: linux-fieldwork/landlock-restore-order-v1
        run: |
          set -eufo pipefail
          git checkout --detach "$BASE_SHA"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one source block, found {count}"
                  )
              file_path.write_text(text.replace(old, new, 1))

          vm_anchor = "        Vm::new_from_memory_manager(\n"
          vm_replacement = (
              "        if snapshot.is_some() && vm_config.lock().unwrap().landlock_enable {\n"
              "            vm_config\n"
              "                .lock()\n"
              "                .unwrap()\n"
              "                .apply_landlock()\n"
              "                .map_err(Error::ApplyLandlock)?;\n"
              "        }\n"
              "\n"
              "        Vm::new_from_memory_manager(\n"
          )
          replace_once("vmm/src/vm.rs", vm_anchor, vm_replacement)

          restore_block = (
              "                if self\n"
              "                    .vm_config\n"
              "                    .as_ref()\n"
              "                    .unwrap()\n"
              "                    .lock()\n"
              "                    .unwrap()\n"
              "                    .landlock_enable\n"
              "                {\n"
              "                    let mut config = self.vm_config.as_ref().unwrap().lock().unwrap();\n"
              "                    apply_landlock(&mut config).map_err(VmError::ApplyLandlock)?;\n"
              "                }\n"
              "\n"
          )
          replace_once("vmm/src/lib.rs", restore_block, "")
          PY

          git diff --check
          git diff -- vmm/src/vm.rs vmm/src/lib.rs

          git config user.name 'Leo'
          git config user.email 'cheerleaderleo@outlook.com'
          git add vmm/src/vm.rs vmm/src/lib.rs
          git diff --cached --stat
          git commit -m 'vmm: apply Landlock before restoring devices' \
            -m 'Snapshot memory must be available while the memory manager is restored, but device reconstruction should not open configured or transitive paths before the VM Landlock policy is active.' \
            -m 'Apply the existing VM configuration rules after snapshot memory restoration and before CPU/device reconstruction. Remove the old post-construction restore restriction so the ruleset is applied once at the effective ownership boundary.' \
            -m 'Assisted-by: ChatGPT:GPT-5.6 Sol' \
            -m 'Signed-off-by: Leo <cheerleaderleo@outlook.com>'

          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

name: Fieldwork Landlock restore-order materializer

on:
  push:
    branches:
      - linux-fieldwork/landlock-restore-order-materializer

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout materializer branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Recreate v3 product bytes and push v4 candidate
        env:
          BASE_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
          SOURCE_BRANCH: linux-fieldwork/landlock-restore-order-v3
          CANDIDATE_BRANCH: linux-fieldwork/landlock-restore-order-v4
        run: |
          set -eufo pipefail

          git fetch origin "$SOURCE_BRANCH"
          git diff "$BASE_SHA" "origin/$SOURCE_BRANCH" -- \
            vmm/src/memory_manager.rs \
            vmm/src/vm_config.rs \
            vmm/src/vm.rs \
            vmm/src/lib.rs > /tmp/v4.patch

          test -s /tmp/v4.patch
          git checkout --detach "$BASE_SHA"
          git apply --check /tmp/v4.patch
          git apply /tmp/v4.patch
          git diff --check

          git config user.name 'Leo'
          git config user.email 'cheerleaderleo@outlook.com'
          git add \
            vmm/src/memory_manager.rs \
            vmm/src/vm_config.rs \
            vmm/src/vm.rs \
            vmm/src/lib.rs

          cat > /tmp/commit-message <<'EOF'
          vmm: apply Landlock before snapshot restore setup

          Snapshot restore currently builds memory and devices before applying the
          VM Landlock policy. Those constructors can retain access to paths that
          the same policy would deny on fresh boot.

          Apply the saved VM policy at the start of snapshot Vm::new(). Add only
          the exact memory-ranges file needed by restore and /dev/userfaultfd when
          on-demand restore can use that device.

          Memory-zone, UFFD-handler, and device construction then run behind the
          inherited restriction. Remove the old post-construction restore rule so
          the VMM thread receives the policy once.

          Assisted-by: ChatGPT:GPT-5.6 Sol
          Signed-off-by: Leo <cheerleaderleo@outlook.com>
          EOF

          sed -i 's/^          //' /tmp/commit-message
          git commit -F /tmp/commit-message
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

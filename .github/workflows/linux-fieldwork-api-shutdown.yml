name: Linux Fieldwork API shutdown events

on:
  push:
    branches:
      - linux-fieldwork/api-shutdown-events
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: --cfg devcli_testenv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply retained source patch
        run: patch --fuzz=0 --no-backup-if-mismatch -p1 < linux-fieldwork/0001-tests-use-shutdown-events-for-api-lifecycle.patch
      - name: Verify candidate contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cloud-hypervisor/tests/common/tests_wrappers.rs').read_text()
          assert p.count('.args(["--no-shutdown"])') == 2
          assert p.count('sudo poweroff') >= 2
          assert p.count('wait_for_latest_events_exact(') >= 2
          assert 'wait_for_ssh_unresponsive(Duration::from_secs(20))' not in p[p.index('pub(crate) fn _test_api_shutdown'):p.index('pub(crate) fn _test_api_pause_resume')]
          print('candidate-contract-ok')
          PY
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile HTTP and D-Bus integration tests
        run: cargo test -p cloud-hypervisor --test integration --features dbus_api --no-run
      - name: Inventory exact lifecycle test selectors
        run: |
          cargo test -p cloud-hypervisor --test integration --features dbus_api -- --list \
            | tee /tmp/integration-tests.txt
          grep -E 'test_api_(http|dbus)_(shutdown|delete)' /tmp/integration-tests.txt \
            | tee /tmp/lifecycle-tests.txt
          test "$(wc -l < /tmp/lifecycle-tests.txt)" -eq 4
      - name: Probe hosted KVM prerequisite
        run: |
          ls -l /dev/kvm 2>/dev/null || true
          if sudo test -c /dev/kvm; then
            echo 'KVM_PREREQUISITE=available-to-root'
          else
            echo 'KVM_PREREQUISITE=unavailable'
            exit 1
          fi

  lifecycle-runtime:
    if: ${{ false }}
    needs: focused
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Runtime matrix already passed in run 30953976821, job 92176887306.'

  materialize-clean-candidate:
    if: github.event_name == 'push'
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build one signed-off source commit from current canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          base=ae04fa80b2e0e52b7a9f4b3fd4239698df586673
          target=linux-fieldwork/api-shutdown-events-clean

          cp linux-fieldwork/0001-tests-use-shutdown-events-for-api-lifecycle.patch /tmp/api-shutdown.patch
          git checkout --detach "$base"
          patch --fuzz=0 --no-backup-if-mismatch -p1 < /tmp/api-shutdown.patch

          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'cloud-hypervisor/tests/common/tests_wrappers.rs'

          git config user.name leo03164
          git config user.email leo03164@gmail.com
          git add cloud-hypervisor/tests/common/tests_wrappers.rs
          git commit -s \
            -m 'tests: use shutdown events for API lifecycle gates' \
            -m 'The API shutdown and delete tests currently treat loss of SSH as proof that guest shutdown completed. sshd can stop while guest and VMM cleanup is still in progress, but the tests immediately reuse the VM and disk.' \
            -m 'Start these VMMs with --no-shutdown and an event monitor. Power the guest off normally, wait for the exact shutdown event, and only then perform the next API lifecycle transition.' \
            -m 'Fixes: #8046'

          git push --force origin "HEAD:refs/heads/$target"
          git log -1 --show-signature --format=fuller

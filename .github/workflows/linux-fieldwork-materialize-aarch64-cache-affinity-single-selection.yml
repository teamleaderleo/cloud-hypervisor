name: Linux Fieldwork validate single-selection AArch64 cache topology

on:
  push:
    branches:
      - linux-fieldwork/materialize-aarch64-cache-affinity-single-selection

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild cache selection on the clean three-commit cache series
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/linux-fieldwork-aarch64-cache-affinity-single-selection.py /tmp/materialize.py
          git checkout --detach 8708ca7fdd6df316ce7481a0f749b8a276991971
          test "$(git rev-parse HEAD:arch/src/aarch64/cache.rs)" = "06a290e1b427e0f8f365de326d942c7a3d6f0364"
          test "$(git rev-parse HEAD:arch/src/aarch64/fdt.rs)" = "8b6b4bd67d264199b7962c57e25f7b25b594a770"
          test "$(git rev-parse HEAD:arch/src/aarch64/mod.rs)" = "f70d75e77063a7ac8fffeefc8d720e051bcafc0b"
          test "$(git rev-parse HEAD:vmm/src/cpu.rs)" = "ac3be996eec408bb835472a891ed4e6cf6885d3a"
          test "$(git rev-parse HEAD:vmm/src/vm.rs)" = "dbd3ab104aa8745420cf3f2243e0a70563cb58bd"
          test "$(git rev-parse HEAD:vmm/src/vm_config.rs)" = "3cea9e18ab630517d98206fa4eb70ce16359166d"
          python3 /tmp/materialize.py
          cargo fmt --all
          git diff --check
          grep -q 'read_common_cache_topology' arch/src/aarch64/cache.rs
          ! grep -q 'read_cache_topology' arch/src/aarch64/fdt.rs
          ! grep -q 'read_cache_topology' vmm/src/cpu.rs
          grep -q 'Path::new("/sys/devices/system/cpu")' vmm/src/vm_config.rs

      - name: Run focused AArch64 unit tests
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER='qemu-aarch64 -L /usr/aarch64-linux-gnu'
          cargo test --locked -p arch --target aarch64-unknown-linux-gnu --features kvm aarch64::cache::tests
          cargo test --locked -p vmm --target aarch64-unknown-linux-gnu --features kvm cache_affinity_tests
          cargo test --locked -p vmm --target aarch64-unknown-linux-gnu --features kvm pptt_cache_exposure_tests

      - name: Cross-check AArch64 backends and x86
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          cargo check --locked -p vmm --target aarch64-unknown-linux-gnu --features kvm
          cargo check --locked -p vmm --target aarch64-unknown-linux-gnu --features mshv
          cargo clippy --locked -p vmm --target aarch64-unknown-linux-gnu --features kvm --lib -- -D warnings
          cargo clippy --locked -p vmm --features kvm --lib -- -D warnings
          cargo fmt --all -- --check
          git diff --check

      - name: Publish clean source commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/files
          printf '%s\n' \
            arch/src/aarch64/cache.rs \
            arch/src/aarch64/fdt.rs \
            arch/src/aarch64/mod.rs \
            vmm/src/cpu.rs \
            vmm/src/vm.rs \
            vmm/src/vm_config.rs | sort > /tmp/expected
          cmp /tmp/files /tmp/expected
          git config user.name Leo
          git config user.email cheerleaderleo@outlook.com
          git add arch/src/aarch64/cache.rs arch/src/aarch64/fdt.rs arch/src/aarch64/mod.rs vmm/src/cpu.rs vmm/src/vm.rs vmm/src/vm_config.rs
          git commit -s -m 'aarch64: select one truthful cache topology per boot' -m 'Derive the host CPUs that boot vCPUs may execute on, read one common cache topology across that set, and retain the selected value in CpuManager. ACPI/PPTT and FDT then consume the same boot-time snapshot instead of independently rereading sysfs. Preserve L3 only when the eligible CPUs share the same discovered L3 domain.'
          test "$(git rev-parse HEAD^)" = "8708ca7fdd6df316ce7481a0f749b8a276991971"
          git push origin +HEAD:refs/heads/linux-fieldwork/aarch64-cache-affinity-single-selection-series

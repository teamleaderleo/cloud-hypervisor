name: Linux Fieldwork materialize common SMBIOS model source

on:
  push:
    branches:
      - linux-fieldwork/materialize-smbios-common-model-source

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild reviewed model relocation on current main
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 1af93ac7035cda77cd87b0c18b1134ebb0928052
          cat > arch/src/smbios.rs <<'RS'
          // Copyright © 2026 Contributors to the Cloud Hypervisor project
          //
          // SPDX-License-Identifier: Apache-2.0

          pub(crate) const DEFAULT_SYSTEM_MANUFACTURER: &str = "Cloud Hypervisor";
          pub(crate) const DEFAULT_SYSTEM_PRODUCT_NAME: &str = "cloud-hypervisor";

          #[derive(Clone, Debug, Default, PartialEq, Eq)]
          pub struct SmbiosConfig {
              pub system: Option<SmbiosSystem>,
              pub chassis: Option<SmbiosChassisConfig>,
              pub oem_strings: Box<[String]>,
          }

          #[derive(Clone, Debug, Default, PartialEq, Eq)]
          pub struct SmbiosSystem {
              pub manufacturer: Option<String>,
              pub product_name: Option<String>,
              pub version: Option<String>,
              pub serial_number: Option<String>,
              pub uuid: Option<String>,
              pub sku_number: Option<String>,
              pub family: Option<String>,
          }

          #[derive(Clone, Debug, Default, PartialEq, Eq)]
          pub struct SmbiosChassisConfig {
              pub asset_tag: Option<String>,
          }

          impl SmbiosConfig {
              pub fn is_empty(&self) -> bool {
                  *self == Self::default()
              }
          }
          RS

          python3 - <<'PY'
          from pathlib import Path

          p = Path("arch/src/lib.rs")
          s = p.read_text()
          anchor = "type GuestRegionMmap = vm_memory::GuestRegionMmap<AtomicBitmap>;\n"
          if s.count(anchor) != 1:
              raise SystemExit("arch lib insertion anchor drifted")
          p.write_text(s.replace(anchor, anchor + "\npub mod smbios;\n", 1))

          p = Path("arch/src/x86_64/smbios.rs")
          s = p.read_text()
          import_anchor = "use crate::GuestMemoryMmap;"
          imports = "pub use crate::smbios::{SmbiosChassisConfig, SmbiosConfig, SmbiosSystem};\nuse crate::smbios::{DEFAULT_SYSTEM_MANUFACTURER, DEFAULT_SYSTEM_PRODUCT_NAME};\n"
          if s.count(import_anchor) != 1:
              raise SystemExit("x86 import anchor drifted")
          s = s.replace(import_anchor, imports + import_anchor, 1)
          start = s.find("pub const DEFAULT_SYSTEM_MANUFACTURER")
          end = s.find("fn compute_checksum", start)
          if start < 0 or end < 0:
              raise SystemExit("x86 model block anchors drifted")
          s = s[:start] + s[end:]
          p.write_text(s)

          p = Path("vmm/src/vm_config.rs")
          s = p.read_text()
          old = "#[cfg(target_arch = \"x86_64\")]\nimpl PlatformConfig {"
          if s.count(old) != 1:
              raise SystemExit("PlatformConfig cfg anchor drifted")
          s = s.replace(old, "impl PlatformConfig {", 1)
          replacements = {
              "arch::x86_64::SmbiosConfig": "arch::smbios::SmbiosConfig",
              "arch::x86_64::SmbiosSystem": "arch::smbios::SmbiosSystem",
              "arch::x86_64::SmbiosChassisConfig": "arch::smbios::SmbiosChassisConfig",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"missing vm_config model reference: {old}")
              s = s.replace(old, new)
          p.write_text(s)
          PY

          cargo fmt --all
          git diff --check

      - name: Prove existing x86 public import path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arch/tests
          cat > arch/tests/fieldwork_smbios_public_api.rs <<'RS'
          use arch::x86_64::{SmbiosChassisConfig, SmbiosConfig, SmbiosSystem};

          #[test]
          fn existing_x86_smbios_types_remain_importable() {
              let _ = SmbiosConfig::default();
              let _ = SmbiosSystem::default();
              let _ = SmbiosChassisConfig::default();
          }
          RS
          cargo test --locked -p arch --test fieldwork_smbios_public_api --features kvm
          rm arch/tests/fieldwork_smbios_public_api.rs

      - name: Validate x86 and AArch64 consumers
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p arch --lib smbios --features kvm
          cargo check --locked -p vmm --features kvm
          cargo clippy --locked -p arch -p vmm --features kvm -- -D warnings

          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          cargo check --locked -p arch -p vmm --target aarch64-unknown-linux-gnu --no-default-features --features kvm
          cargo fmt --all -- --check
          git diff --check

      - name: Publish clean source branch
        shell: bash
        run: |
          set -euo pipefail
          test ! -e arch/tests/fieldwork_smbios_public_api.rs
          git diff --name-only | sort > /tmp/files
          printf '%s\n' arch/src/lib.rs arch/src/smbios.rs arch/src/x86_64/smbios.rs vmm/src/vm_config.rs | sort > /tmp/expected
          cmp /tmp/files /tmp/expected

          git config user.name Leo
          git config user.email cheerleaderleo@outlook.com
          git add arch/src/lib.rs arch/src/smbios.rs arch/src/x86_64/smbios.rs vmm/src/vm_config.rs
          git commit -s -m 'arch: share SMBIOS configuration model across architectures' -m 'Move the SMBIOS configuration data model into common arch code so platform configuration can construct it on every architecture. Preserve the existing x86 public type re-exports; table generation, default strings, and placement remain architecture-specific implementation details.'
          test "$(git rev-parse HEAD^)" = "1af93ac7035cda77cd87b0c18b1134ebb0928052"
          git push origin +HEAD:refs/heads/linux-fieldwork/smbios-common-model-source

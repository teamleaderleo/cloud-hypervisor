name: Linux Fieldwork materialize migration Gate candidate

on:
  push:
    branches:
      - linux-fieldwork/materialize-migration-gate-r603
    paths:
      - .github/workflows/linux-fieldwork-materialize-migration-gate-r603.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CH_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      OUT_BRANCH: linux-fieldwork/review-migration-gate-r603
      BUG_TEST: migration::transport::sender_gate_review_tests::worker_error_does_not_block_gate_enqueue
      CONTROL_TEST: migration::transport::sender_gate_review_tests::full_queue_healthy_worker_completes
    steps:
      - name: Check out exact Cloud Hypervisor source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CH_SHA }}
          path: cloud-hypervisor
          persist-credentials: true

      - name: Pin source and toolchain
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$CH_SHA"
          test -z "$(git status --short)"
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 rustfmt clippy
          rustup override set 1.89.0
          rustc --version

      - name: Materialize exact reviewed Gate candidate and regressions
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vmm/src/migration/transport.rs')
          s = p.read_text()

          old = '''        for _ in 0..self.threads.len() {\n            self.message_tx\n                .send(SendMemoryThreadMessage::Gate(gate.clone()))\n                .context("Error sending gate message to workers")\n                .map_err(MigratableError::MigrateSend)?;\n        }\n'''
          new = '''        for _ in 0..self.threads.len() {\n            let mut gate_message = SendMemoryThreadMessage::Gate(gate.clone());\n            loop {\n                if self.worker_error.load(Ordering::Relaxed) {\n                    gate.open();\n                    return self.cleanup();\n                }\n\n                match self.message_tx.try_send(gate_message) {\n                    Ok(()) => break,\n                    Err(TrySendError::Full(unsent_message)) => {\n                        thread::sleep(Duration::from_millis(10));\n                        gate_message = unsent_message;\n                    }\n                    Err(TrySendError::Disconnected(_)) => {\n                        gate.open();\n                        return Err(self.cleanup().err().unwrap_or(MigratableError::MigrateSend(\n                            anyhow!("All sending threads disconnected, but none returned an error?"),\n                        )));\n                    }\n                }\n            }\n        }\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          anchor = '#[cfg(test)]\nmod tests {'
          assert s.count(anchor) == 1
          tests = r'''#[cfg(test)]
          mod sender_gate_review_tests {
              use std::sync::Arc;
              use std::sync::atomic::AtomicBool;
              use std::sync::mpsc::{channel, sync_channel};
              use std::thread;
              use std::time::Duration;

              use anyhow::anyhow;
              use vm_migration::MigratableError;
              use vm_migration::protocol::MemoryRangeTable;

              use super::{
                  GuestAddress, GuestMemoryAtomic, GuestMemoryMmap, SendAdditionalConnections,
                  SendMemoryThreadMessage, SendMemoryThreadNotify,
              };

              fn guest_memory() -> GuestMemoryAtomic<GuestMemoryMmap> {
                  GuestMemoryAtomic::new(
                      GuestMemoryMmap::from_ranges(&[(GuestAddress(0), 0x1000)]).unwrap(),
                  )
              }

              #[test]
              fn full_queue_healthy_worker_completes() {
                  let (message_tx, message_rx) = sync_channel(1);
                  message_tx
                      .send(SendMemoryThreadMessage::Memory(MemoryRangeTable::default()))
                      .unwrap();
                  let (notify_tx, notify_rx) = channel();
                  let worker = thread::spawn(move || -> Result<(), MigratableError> {
                      thread::sleep(Duration::from_millis(20));
                      assert!(matches!(
                          message_rx.recv().unwrap(),
                          SendMemoryThreadMessage::Memory(_)
                      ));
                      match message_rx.recv().unwrap() {
                          SendMemoryThreadMessage::Gate(gate) => {
                              notify_tx.send(SendMemoryThreadNotify::Gate).unwrap();
                              gate.wait();
                          }
                          _ => panic!("expected Gate after queued Memory"),
                      }
                      match message_rx.recv().unwrap() {
                          SendMemoryThreadMessage::Disconnect => Ok(()),
                          _ => panic!("expected Disconnect after Gate"),
                      }
                  });

                  let mut connections = SendAdditionalConnections {
                      guest_memory: guest_memory(),
                      threads: vec![worker],
                      message_tx,
                      worker_error: Arc::new(AtomicBool::new(false)),
                      notify_rx,
                  };

                  connections.wait_for_pending_data().unwrap();
                  connections.cleanup().unwrap();
              }

              #[test]
              fn worker_error_does_not_block_gate_enqueue() {
                  let (message_tx, message_rx) = sync_channel(1);
                  message_tx
                      .send(SendMemoryThreadMessage::Memory(MemoryRangeTable::default()))
                      .unwrap();
                  let (_notify_tx, notify_rx) = channel();
                  let worker_error = Arc::new(AtomicBool::new(true));
                  let worker = thread::spawn(|| -> Result<(), MigratableError> {
                      Err(MigratableError::MigrateSend(anyhow!("injected worker failure")))
                  });

                  let mut connections = SendAdditionalConnections {
                      guest_memory: guest_memory(),
                      threads: vec![worker],
                      message_tx,
                      worker_error,
                      notify_rx,
                  };

                  let _message_rx = message_rx;
                  let err = connections.wait_for_pending_data().unwrap_err();
                  assert!(matches!(err, MigratableError::MigrateSend(_)));
              }
          }

          '''
          s = s.replace(anchor, tests + anchor, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only)" = "vmm/src/migration/transport.rs"
          git diff -- vmm/src/migration/transport.rs | tee ../r603-review.diff

      - name: Execute focused and broad VMM gates
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
          cargo test --locked -p vmm --features kvm --lib -- --list | tee ../r603-test-list.txt
          grep -F "$BUG_TEST: test" ../r603-test-list.txt
          grep -F "$CONTROL_TEST: test" ../r603-test-list.txt
          timeout --signal=TERM --kill-after=2s 10s cargo test --locked -p vmm --features kvm --lib "$BUG_TEST" -- --exact --nocapture 2>&1 | tee ../r603-bug.log
          timeout --signal=TERM --kill-after=2s 10s cargo test --locked -p vmm --features kvm --lib "$CONTROL_TEST" -- --exact --nocapture 2>&1 | tee ../r603-control.log
          cargo test --locked -p vmm --features kvm --lib 2>&1 | tee ../r603-vmm-tests.log

      - name: Quality gates
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo clippy --locked -p vmm --features kvm --lib --tests -- -D warnings -A unfulfilled-lint-expectations 2>&1 | tee ../r603-clippy.log
          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only)" = "vmm/src/migration/transport.rs"

      - name: Commit and publish clean review branch
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Leo"
          git config user.email "cheerleaderleo@outlook.com"
          git switch -c "$OUT_BRANCH"
          git add vmm/src/migration/transport.rs
          git commit -s -m "vmm: Keep migration Gate enqueue cancellation-aware" -m "Use the same nonblocking bounded-queue progress discipline as memory chunk enqueue so a sender worker failure cannot strand the main migration thread before cleanup. Add full-queue failure and healthy-progress regressions." -m "Assisted-by: ChatGPT:GPT-5.6 Sol"
          test "$(git rev-list --count "$CH_SHA"..HEAD)" = 1
          test "$(git diff --name-only "$CH_SHA"...HEAD)" = "vmm/src/migration/transport.rs"
          git push --force-with-lease origin "HEAD:refs/heads/$OUT_BRANCH"
          git rev-parse HEAD | tee ../r603-review-head.txt
          git rev-parse HEAD^{tree} | tee ../r603-review-tree.txt

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-gate-r603-review
          if-no-files-found: warn
          path: |
            r603-review.diff
            r603-test-list.txt
            r603-bug.log
            r603-control.log
            r603-vmm-tests.log
            r603-clippy.log
            r603-review-head.txt
            r603-review-tree.txt

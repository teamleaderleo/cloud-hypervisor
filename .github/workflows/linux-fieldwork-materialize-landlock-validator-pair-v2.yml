name: Linux Fieldwork materialize repaired Landlock validator pair

on:
  push:
    branches: [linux-fieldwork/materialize-landlock-validator-pair-v2]
    paths: [.github/workflows/linux-fieldwork-materialize-landlock-validator-pair-v2.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      PRODUCT_HEAD: f0d19b3c3f85f06d0987f188156f97552d01f61d
      TEST_SOURCE_HEAD: e1b95da99ad772f0eff815ebe20932d6e40346f8
      CANDIDATE_BRANCH: linux-fieldwork/landlock-restore-order-v4-validation
      BASELINE_BRANCH: linux-fieldwork/landlock-restore-order-baseline-validation
      TEST_PATH: cloud-hypervisor/tests/integration.rs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 rustfmt clippy
      - name: Prepare identical repaired test file
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/landlock-candidate "$PRODUCT_HEAD"
          git worktree add --detach /tmp/landlock-baseline "$BASE_SHA"
          git show "$TEST_SOURCE_HEAD:$TEST_PATH" > /tmp/repaired-integration.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/repaired-integration.rs')
          s = p.read_text()
          old = 'Path::new(guest.disk_config.disk(DiskType::OperatingSystem).unwrap())'
          new = 'Path::new(&guest.disk_config.disk(DiskType::OperatingSystem).unwrap())'
          if s.count(old) != 1:
              raise SystemExit(f'unexpected backing path expression count: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          cp /tmp/repaired-integration.rs "/tmp/landlock-candidate/$TEST_PATH"
          cd /tmp/landlock-candidate
          cargo +1.89.0 fmt --all
          test "$(git diff --name-only)" = "$TEST_PATH"
          grep -F 'fn test_snapshot_restore_landlock_qcow_backing()' "$TEST_PATH"
          cp "$TEST_PATH" "/tmp/landlock-baseline/$TEST_PATH"
          test "$(git hash-object "$TEST_PATH")" = "$(git -C /tmp/landlock-baseline hash-object "$TEST_PATH")"
      - name: Compile candidate validator
        working-directory: /tmp/landlock-candidate
        run: |
          set +e
          cargo +1.89.0 test --locked -p cloud-hypervisor --test integration --features kvm --no-run > /tmp/candidate-build.log 2>&1
          rc=$?
          set -e
          cat /tmp/candidate-build.log
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -n 24 /tmp/candidate-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Landlock candidate compile::$msg"
            exit "$rc"
          fi
          cargo +1.89.0 fmt --all -- --check
          git diff --check
      - name: Compile baseline validator
        working-directory: /tmp/landlock-baseline
        run: |
          set +e
          cargo +1.89.0 test --locked -p cloud-hypervisor --test integration --features kvm --no-run > /tmp/baseline-build.log 2>&1
          rc=$?
          set -e
          cat /tmp/baseline-build.log
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -n 24 /tmp/baseline-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Landlock baseline compile::$msg"
            exit "$rc"
          fi
          cargo +1.89.0 fmt --all -- --check
          git diff --check
          grep -F 'fn test_snapshot_restore_landlock_qcow_backing()' "$TEST_PATH"
          test "$(git hash-object "$TEST_PATH")" = "$(git -C /tmp/landlock-candidate hash-object "$TEST_PATH")"
      - name: Commit identical test blobs
        run: |
          set -euo pipefail
          for tree in /tmp/landlock-candidate /tmp/landlock-baseline; do
            git -C "$tree" config user.name Leo
            git -C "$tree" config user.email cheerleaderleo@outlook.com
            git -C "$tree" add "$TEST_PATH"
            git -C "$tree" commit --signoff -m 'tests: Validate Landlock snapshot restore ordering' -m 'Exercise denied backing access, explicit backing allowance, and on-demand restore using the same integration test bytes on the product candidate and exact baseline.'
          done
          test "$(git -C /tmp/landlock-candidate rev-parse HEAD^)" = "$PRODUCT_HEAD"
          test "$(git -C /tmp/landlock-baseline rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git -C /tmp/landlock-candidate rev-parse HEAD:"$TEST_PATH")" = "$(git -C /tmp/landlock-baseline rev-parse HEAD:"$TEST_PATH")"
      - name: Publish paired validator branches
        run: |
          set -euo pipefail
          git -C /tmp/landlock-candidate push --force origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          git -C /tmp/landlock-baseline push --force origin "HEAD:refs/heads/$BASELINE_BRANCH"
